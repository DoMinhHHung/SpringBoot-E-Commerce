<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Khuyến mãi - E-Commerce</title>
    
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <!-- Custom CSS -->
    <link href="/css/style.css" rel="stylesheet">
</head>
<body>
    <!-- Header -->
    <div id="header-container"></div>

    <!-- Main Content -->
    <main class="container my-5">
        <h1 class="mb-4">Khuyến mãi đang diễn ra</h1>

        <!-- Filter Tabs -->
        <ul class="nav nav-tabs mb-4">
            <li class="nav-item">
                <a class="nav-link active" data-bs-toggle="tab" href="#active" onclick="loadActivePromotions()">
                    Đang diễn ra
                </a>
            </li>
            <li class="nav-item">
                <a class="nav-link" data-bs-toggle="tab" href="#upcoming" onclick="loadUpcomingPromotions()">
                    Sắp diễn ra
                </a>
            </li>
        </ul>

        <!-- Loading Spinner -->
        <div id="loading-spinner" class="loading-spinner active">
            <div class="spinner-border text-primary" role="status">
                <span class="visually-hidden">Loading...</span>
            </div>
        </div>

        <!-- Promotions Content -->
        <div id="promotions-content" class="d-none">
            <div class="tab-content">
                <!-- Active Promotions -->
                <div class="tab-pane fade show active" id="active">
                    <div id="active-promotions-container" class="row g-4">
                        <!-- Active promotions will be loaded here -->
                    </div>
                </div>

                <!-- Upcoming Promotions -->
                <div class="tab-pane fade" id="upcoming">
                    <div id="upcoming-promotions-container" class="row g-4">
                        <!-- Upcoming promotions will be loaded here -->
                    </div>
                </div>
            </div>
        </div>

        <!-- Empty State -->
        <div id="empty-state" class="text-center py-5 d-none">
            <i class="bi bi-gift" style="font-size: 4rem; color: #ccc;"></i>
            <p class="mt-3 text-muted">Không có khuyến mãi nào</p>
        </div>
    </main>

    <!-- Footer -->
    <div id="footer-container"></div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Common JS -->
    <script src="/js/common.js"></script>
    <!-- API Client -->
    <script src="/js/api.js"></script>
    <!-- Page Script -->
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            loadActivePromotions();
        });

        async function loadActivePromotions() {
            document.getElementById('loading-spinner').classList.add('active');
            document.getElementById('promotions-content').classList.add('d-none');
            document.getElementById('empty-state').classList.add('d-none');

            try {
                const promotions = await apiClient.getActivePromotions();
                displayPromotions(promotions, 'active-promotions-container');
                
                if (promotions.length === 0) {
                    document.getElementById('empty-state').classList.remove('d-none');
                }
            } catch (error) {
                showAlert('Không thể tải khuyến mãi: ' + error.message, 'error');
            } finally {
                document.getElementById('loading-spinner').classList.remove('active');
                document.getElementById('promotions-content').classList.remove('d-none');
            }
        }

        async function loadUpcomingPromotions() {
            document.getElementById('loading-spinner').classList.add('active');
            document.getElementById('promotions-content').classList.add('d-none');
            document.getElementById('empty-state').classList.add('d-none');

            try {
                const promotions = await apiClient.request('/promotions/upcoming', {
                    method: 'GET',
                    skipAuth: true
                });
                displayPromotions(promotions, 'upcoming-promotions-container');
                
                if (promotions.length === 0) {
                    document.getElementById('empty-state').classList.remove('d-none');
                }
            } catch (error) {
                showAlert('Không thể tải khuyến mãi: ' + error.message, 'error');
            } finally {
                document.getElementById('loading-spinner').classList.remove('active');
                document.getElementById('promotions-content').classList.remove('d-none');
            }
        }

        function displayPromotions(promotions, containerId) {
            const container = document.getElementById(containerId);
            
            if (promotions.length === 0) {
                container.innerHTML = '<div class="col-12 text-center text-muted">Không có khuyến mãi</div>';
                return;
            }

            container.innerHTML = promotions.map(promo => `
                <div class="col-md-6">
                    <div class="card h-100 shadow-sm">
                        <div class="card-body">
                            <div class="d-flex justify-content-between align-items-start mb-3">
                                <h4 class="card-title">${promo.name}</h4>
                                <span class="badge bg-danger fs-6">-${promo.discountPercent}%</span>
                            </div>
                            <p class="text-muted">${promo.description || 'Không có mô tả'}</p>
                            <div class="mb-3">
                                <small class="text-muted">
                                    <i class="bi bi-calendar-event"></i> 
                                    Từ ${formatDate(promo.startDate)} đến ${formatDate(promo.endDate)}
                                </small>
                            </div>
                            <button class="btn btn-primary-custom w-100" onclick="viewPromotionProducts(${promo.id})">
                                Xem sản phẩm khuyến mãi
                            </button>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        async function viewPromotionProducts(promotionId) {
            try {
                const products = await apiClient.getProductsByPromotion(promotionId);
                
                if (products.length === 0) {
                    showAlert('Không có sản phẩm nào trong khuyến mãi này', 'info');
                    return;
                }

                // Create modal to show products
                const modalHtml = `
                    <div class="modal fade" id="promotionProductsModal" tabindex="-1">
                        <div class="modal-dialog modal-lg">
                            <div class="modal-content">
                                <div class="modal-header">
                                    <h5 class="modal-title">Sản phẩm khuyến mãi</h5>
                                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                                </div>
                                <div class="modal-body">
                                    <div class="row g-3">
                                        ${products.map(p => `
                                            <div class="col-md-6">
                                                <div class="product-card">
                                                    <a href="/product-detail.html?id=${p.id}">
                                                        <img src="${p.mainImage}"
                                                             alt="${p.name}"
                                                             class="product-image">
                                                    </a>
                                                    <div class="product-card-body">
                                                        <h5 class="product-title">${p.name}</h5>
                                                        <div class="product-price">
                                                            ${p.priceAfterDiscount && p.priceAfterDiscount < p.price ? 
                                                                `<span class="price-old">${formatPrice(p.price)}</span>
                                                                 <span class="price-new">${formatPrice(p.priceAfterDiscount)}</span>` :
                                                                `<span class="price-new">${formatPrice(p.price)}</span>`
                                                            }
                                                        </div>
                                                    </div>
                                                </div>
                                            </div>
                                        `).join('')}
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                `;
                
                // Remove existing modal if any
                const existingModal = document.getElementById('promotionProductsModal');
                if (existingModal) {
                    existingModal.remove();
                }
                
                // Add modal to body
                document.body.insertAdjacentHTML('beforeend', modalHtml);
                
                // Show modal
                const modal = new bootstrap.Modal(document.getElementById('promotionProductsModal'));
                modal.show();
                
                // Remove modal from DOM when hidden
                document.getElementById('promotionProductsModal').addEventListener('hidden.bs.modal', function() {
                    this.remove();
                });
            } catch (error) {
                showAlert('Không thể tải sản phẩm: ' + error.message, 'error');
            }
        }
    </script>
</body>
</html>
