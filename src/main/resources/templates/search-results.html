<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tìm kiếm - E-Commerce</title>
    
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <!-- Custom CSS -->
    <link href="/css/style.css" rel="stylesheet">
    <link rel="icon" href="/logo/logo_web.png">
</head>
<body>
    <!-- Header -->
    <div id="header-container"></div>

    <!-- Main Content -->
    <main class="container my-4">
        <!-- Page Header -->
        <div class="mb-4">
            <h1 class="fw-bold mb-2">Tìm kiếm</h1>
            <p class="text-muted mb-3" id="search-summary">Có <span id="total-count">0</span> sản phẩm cho tìm kiếm</p>
            <div class="search-query-display mb-3">
                <p class="mb-0">Kết quả tìm kiếm cho "<span id="search-query" class="fw-bold"></span>"</p>
            </div>
        </div>

        <!-- Sort Options -->
        <div class="mb-4">
            <div class="d-flex align-items-center gap-2 flex-wrap">
                <span class="fw-semibold">Sắp xếp theo:</span>
                <button class="btn btn-sm sort-btn" data-sort="default" id="sort-default">
                    Mặc định
                </button>
                <button class="btn btn-sm sort-btn" data-sort="price-asc" id="sort-price-asc">
                    Giá thấp -> cao
                </button>
                <button class="btn btn-sm sort-btn" data-sort="price-desc" id="sort-price-desc">
                    Giá cao -> thấp
                </button>
            </div>
        </div>

        <!-- Loading Spinner -->
        <div id="search-loading" class="text-center py-5">
            <div class="spinner-border text-primary" role="status">
                <span class="visually-hidden">Loading...</span>
            </div>
        </div>

        <!-- Products Grid -->
        <div id="search-results-grid" class="products-grid">
            <!-- Products will be loaded here -->
        </div>

        <!-- Empty State -->
        <div id="empty-state" class="text-center py-5 d-none">
            <i class="bi bi-inbox" style="font-size: 4rem; color: #ccc;"></i>
            <p class="mt-3 text-muted">Không tìm thấy sản phẩm nào</p>
        </div>

        <!-- Pagination -->
        <nav aria-label="Search results pagination" class="mt-4">
            <ul class="pagination justify-content-center" id="pagination">
                <!-- Pagination will be loaded here -->
            </ul>
        </nav>
    </main>

    <!-- Footer -->
    <div id="footer-container"></div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Common JS -->
    <script src="/js/common.js"></script>
    <!-- API Client -->
    <script src="/js/api.js"></script>
    <!-- Search Results Page Script -->
    <script src="/js/search-results.js"></script>
</body>
</html>
