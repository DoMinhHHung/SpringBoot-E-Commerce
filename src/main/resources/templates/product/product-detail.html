<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chi tiết sản phẩm - E-Commerce</title>
    
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <!-- Custom CSS -->
    <link href="/css/style.css" rel="stylesheet">
</head>
<body>
    <!-- Header -->
    <div id="header-container"></div>

    <!-- Main Content -->
    <main class="container my-5">
        <!-- Breadcrumb -->
        <nav aria-label="breadcrumb">
            <ol class="breadcrumb">
                <li class="breadcrumb-item"><a href="/index.html">Trang chủ</a></li>
                <li class="breadcrumb-item"><a href="/index.html">Sản phẩm</a></li>
                <li class="breadcrumb-item active" id="breadcrumb-product">Chi tiết</li>
            </ol>
        </nav>

        <!-- Loading Spinner -->
        <div id="loading-spinner" class="loading-spinner active">
            <div class="spinner-border text-primary" role="status">
                <span class="visually-hidden">Loading...</span>
            </div>
        </div>

        <!-- Product Detail -->
        <div id="product-detail" class="d-none">
            <div class="row">
                <!-- Product Images -->
                <div class="col-md-6">
                    <div class="main-image mb-3">
                        <img id="main-product-image" src="" alt="Product" class="img-fluid rounded" style="max-height: 500px; width: 100%; object-fit: contain;">
                    </div>
                    <div class="thumbnail-images d-flex gap-2">
                        <!-- Thumbnails will be loaded here -->
                    </div>
                </div>

                <!-- Product Info -->
                <div class="col-md-6">
                    <h1 id="product-name" class="mb-3"></h1>
                    
                    <div class="product-info mb-4">
                        <div class="product-price mb-3">
                            <span id="price-old" class="price-old me-2"></span>
                            <span id="price-new" class="price-new fs-3"></span>
                            <span id="discount-badge" class="product-discount ms-3"></span>
                        </div>
                        
                        <div class="mb-3">
                            <span class="badge bg-info">Thương hiệu: <span id="product-brand"></span></span>
                            <span class="badge bg-success ms-2">Còn hàng: <span id="product-stock"></span></span>
                        </div>

                        <p id="product-description" class="text-muted"></p>
                    </div>

                    <!-- Specifications -->
                    <div class="specifications mb-4">
                        <h5>Thông số kỹ thuật</h5>
                        <table class="table table-bordered">
                            <tbody id="specifications-table">
                                <!-- Specifications will be loaded here -->
                            </tbody>
                        </table>
                    </div>

                    <!-- Actions -->
                    <div class="product-actions">
                        <div class="quantity-selector mb-3">
                            <label class="form-label">Số lượng:</label>
                            <div class="input-group" style="width: 150px;">
                                <button class="btn btn-outline-secondary" type="button" onclick="decreaseQuantity()">-</button>
                                <input type="number" class="form-control text-center" id="quantity" value="1" min="1">
                                <button class="btn btn-outline-secondary" type="button" onclick="increaseQuantity()">+</button>
                            </div>
                        </div>
                        
                        <button class="btn btn-primary-custom btn-lg w-100 mb-2" onclick="addToCart()">
                            <i class="bi bi-cart-plus"></i> Thêm vào giỏ hàng
                        </button>
                        <button class="btn btn-outline-primary btn-lg w-100" onclick="buyNow()">
                            <i class="bi bi-bag-check"></i> Mua ngay
                        </button>
                    </div>
                </div>
            </div>

            <!-- Related Products Section -->
            <div class="related-products mt-5">
                <h3 class="mb-4">Sản phẩm liên quan</h3>
                <div id="related-products" class="row g-4">
                    <!-- Related products will be loaded here -->
                </div>
            </div>
        </div>

        <!-- Error State -->
        <div id="error-state" class="text-center py-5 d-none">
            <i class="bi bi-exclamation-triangle" style="font-size: 4rem; color: #dc3545;"></i>
            <h3 class="mt-3">Không tìm thấy sản phẩm</h3>
            <p class="text-muted">Sản phẩm bạn đang tìm có thể đã bị xóa hoặc không tồn tại.</p>
            <a href="/index.html" class="btn btn-primary-custom">Quay về trang chủ</a>
        </div>
    </main>

    <!-- Footer -->
    <div id="footer-container"></div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Common JS -->
    <script src="/js/common.js"></script>
    <!-- API Client -->
    <script src="/js/api.js"></script>
    <!-- Page Script -->
    <script>
        let product = null;

        document.addEventListener('DOMContentLoaded', function() {
            const urlParams = new URLSearchParams(window.location.search);
            const productId = urlParams.get('id');
            
            if (productId) {
                loadProductDetail(productId);
            } else {
                showError();
            }
        });

        async function loadProductDetail(id) {
            document.getElementById('loading-spinner').classList.add('active');
            document.getElementById('product-detail').classList.add('d-none');
            document.getElementById('error-state').classList.add('d-none');

            try {
                product = await apiClient.getProductById(id);
                displayProductDetail(product);
                
                // Load related products
                loadRelatedProducts(product.productType);
            } catch (error) {
                showAlert('Không thể tải chi tiết sản phẩm: ' + error.message, 'error');
                showError();
            } finally {
                document.getElementById('loading-spinner').classList.remove('active');
            }
        }

        function displayProductDetail(product) {
            // Update breadcrumb
            document.getElementById('breadcrumb-product').textContent = product.name;
            
            // Product name
            document.getElementById('product-name').textContent = product.name;
            
            // Price
            const priceOldEl = document.getElementById('price-old');
            const priceNewEl = document.getElementById('price-new');
            const discountBadgeEl = document.getElementById('discount-badge');
            
            if (product.priceAfterDiscount && product.priceAfterDiscount < product.price) {
                priceOldEl.textContent = formatPrice(product.price);
                priceOldEl.style.display = 'inline';
                priceNewEl.textContent = formatPrice(product.priceAfterDiscount);
                const discountPercent = Math.round((1 - product.priceAfterDiscount / product.price) * 100);
                discountBadgeEl.textContent = `-${discountPercent}%`;
                discountBadgeEl.style.display = 'inline';
            } else {
                priceOldEl.style.display = 'none';
                priceNewEl.textContent = formatPrice(product.price);
                discountBadgeEl.style.display = 'none';
            }
            
            // Brand and stock
            document.getElementById('product-brand').textContent = product.brand || 'N/A';
            document.getElementById('product-stock').textContent = product.stock || 0;
            
            // Description
            document.getElementById('product-description').textContent = product.description || 'Không có mô tả';
            
            // Images
            const mainImage = product.mainImage || 'https://via.placeholder.com/500x500';
            document.getElementById('main-product-image').src = mainImage;
            
            const thumbnailsContainer = document.querySelector('.thumbnail-images');
            const allImages = product.images && product.images.length > 0 
                ? [mainImage, ...product.images] 
                : [mainImage];
            
            thumbnailsContainer.innerHTML = allImages.map((img, index) => `
                <img src="${img}" 
                     alt="Thumbnail ${index + 1}" 
                     class="img-thumbnail" 
                     style="width: 80px; height: 80px; object-fit: cover; cursor: pointer;"
                     onclick="changeMainImage('${img}')"
                     onerror="this.src='https://via.placeholder.com/80x80'">
            `).join('');
            
            // Specifications
            const specsTable = document.getElementById('specifications-table');
            if (product.specifications && product.specifications.length > 0) {
                specsTable.innerHTML = product.specifications.map(spec => `
                    <tr>
                        <td style="width: 30%;"><strong>${spec.specName}</strong></td>
                        <td>${spec.specValue}</td>
                    </tr>
                `).join('');
            } else {
                specsTable.innerHTML = '<tr><td colspan="2" class="text-muted">Không có thông số kỹ thuật</td></tr>';
            }
            
            // Show product detail
            document.getElementById('product-detail').classList.remove('d-none');
        }

        function changeMainImage(imgSrc) {
            document.getElementById('main-product-image').src = imgSrc;
        }

        function increaseQuantity() {
            const quantityInput = document.getElementById('quantity');
            const currentValue = parseInt(quantityInput.value);
            const maxStock = product ? product.stock : 999;
            if (currentValue < maxStock) {
                quantityInput.value = currentValue + 1;
            }
        }

        function decreaseQuantity() {
            const quantityInput = document.getElementById('quantity');
            const currentValue = parseInt(quantityInput.value);
            if (currentValue > 1) {
                quantityInput.value = currentValue - 1;
            }
        }

        async function loadRelatedProducts(productType) {
            try {
                const relatedProducts = await apiClient.getProductsByType(productType);
                const filtered = relatedProducts.filter(p => p.id !== product.id).slice(0, 4);
                
                const container = document.getElementById('related-products');
                if (filtered.length > 0) {
                    container.innerHTML = filtered.map(p => `
                        <div class="col-md-3">
                            <div class="product-card">
                                <a href="/product-detail.html?id=${p.id}">
                                    <img src="${p.mainImage || 'https://via.placeholder.com/300x250'}" 
                                         alt="${p.name}" 
                                         onerror="this.src='https://via.placeholder.com/300x250'">
                                </a>
                                <div class="product-card-body">
                                    <h5 class="product-title">${p.name}</h5>
                                    <div class="product-price">
                                        ${p.priceAfterDiscount && p.priceAfterDiscount < p.price ? 
                                            `<span class="price-old">${formatPrice(p.price)}</span>
                                             <span class="price-new">${formatPrice(p.priceAfterDiscount)}</span>` :
                                            `<span class="price-new">${formatPrice(p.price)}</span>`
                                        }
                                    </div>
                                </div>
                            </div>
                        </div>
                    `).join('');
                } else {
                    container.innerHTML = '<div class="col-12 text-center text-muted">Không có sản phẩm liên quan</div>';
                }
            } catch (error) {
                console.error('Error loading related products:', error);
            }
        }

        function addToCart() {
            if (!apiClient.isAuthenticated()) {
                showAlert('Vui lòng đăng nhập để thêm sản phẩm vào giỏ hàng', 'warning');
                setTimeout(() => showLoginModal(), 1000);
                return;
            }
            
            const quantity = parseInt(document.getElementById('quantity').value);
            showAlert(`Đã thêm ${quantity} sản phẩm vào giỏ hàng`, 'success');
            // TODO: Implement cart API
        }

        function buyNow() {
            if (!apiClient.isAuthenticated()) {
                showAlert('Vui lòng đăng nhập để mua hàng', 'warning');
                setTimeout(() => showLoginModal(), 1000);
                return;
            }
            showAlert('Tính năng đang được phát triển', 'info');
            // TODO: Implement order API
        }

        function showError() {
            document.getElementById('error-state').classList.remove('d-none');
            document.getElementById('product-detail').classList.add('d-none');
        }
    </script>
</body>
</html>
