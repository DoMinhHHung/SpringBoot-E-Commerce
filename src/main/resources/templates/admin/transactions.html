<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lịch sử Giao dịch - Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <link href="/css/style.css" rel="stylesheet">
</head>
<body>
    <div id="header-container"></div>

    <main class="container my-5">
        <h1><i class="bi bi-wallet2"></i> Lịch sử Giao dịch</h1>
        <p id="admin-welcome" class="text-muted"></p>

        <div class="row">
            <!-- Sidebar Menu -->
            <div class="col-md-3">
                <div class="list-group">
                    <a href="/admin/dashboard.html" class="list-group-item list-group-item-action">Tổng quan</a>
                    <a href="/admin/products.html" class="list-group-item list-group-item-action">Sản phẩm</a>
                    <a href="/admin/promotions.html" class="list-group-item list-group-item-action">Khuyến mãi</a>
                    <a href="/admin/users.html" class="list-group-item list-group-item-action">Người dùng</a>
                    <a href="/admin/orders.html" class="list-group-item list-group-item-action">Đơn hàng</a>
                    <a href="/admin/transactions.html" class="list-group-item list-group-item-action active">Lịch sử giao dịch</a>
                    <a href="/admin/support.html" class="list-group-item list-group-item-action">Hỗ trợ trực tuyến</a>
                </div>
            </div>

            <!-- Main Content -->
            <div class="col-md-9">
                <!-- Filters -->
                <div class="card mb-3">
                    <div class="card-body">
                        <div class="row g-3">
                            <div class="col-md-3">
                                <label class="form-label">Loại giao dịch</label>
                                <select id="filter-type" class="form-select">
                                    <option value="">Tất cả</option>
                                    <option value="PAYMENT">Thanh toán</option>
                                    <option value="REFUND">Hoàn tiền</option>
                                    <option value="DEPOSIT">Nạp tiền</option>
                                    <option value="WITHDRAWAL">Rút tiền</option>
                                </select>
                            </div>
                            <div class="col-md-3">
                                <label class="form-label">Trạng thái</label>
                                <select id="filter-status" class="form-select">
                                    <option value="">Tất cả</option>
                                    <option value="SUCCESS">Thành công</option>
                                    <option value="PENDING">Đang chờ</option>
                                    <option value="FAILED">Thất bại</option>
                                    <option value="CANCELLED">Đã hủy</option>
                                </select>
                            </div>
                            <div class="col-md-3">
                                <label class="form-label">Từ ngày</label>
                                <input type="date" id="filter-start-date" class="form-control">
                            </div>
                            <div class="col-md-3">
                                <label class="form-label">Đến ngày</label>
                                <input type="date" id="filter-end-date" class="form-control">
                            </div>
                            <div class="col-md-12">
                                <button id="btn-apply-filter" class="btn btn-primary">
                                    <i class="bi bi-funnel"></i> Áp dụng
                                </button>
                                <button id="btn-reset-filter" class="btn btn-secondary">
                                    <i class="bi bi-arrow-counterclockwise"></i> Reset
                                </button>
                                <button id="btn-export" class="btn btn-success">
                                    <i class="bi bi-download"></i> Xuất Excel
                                </button>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Summary Cards -->
                <div class="row mb-3">
                    <div class="col-md-3">
                        <div class="card text-white bg-primary">
                            <div class="card-body">
                                <h6 class="card-title">Tổng giao dịch</h6>
                                <h4 id="stat-total-transactions">0</h4>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-3">
                        <div class="card text-white bg-success">
                            <div class="card-body">
                                <h6 class="card-title">Tổng thu</h6>
                                <h4 id="stat-total-revenue">0₫</h4>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-3">
                        <div class="card text-white bg-danger">
                            <div class="card-body">
                                <h6 class="card-title">Tổng chi</h6>
                                <h4 id="stat-total-expense">0₫</h4>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-3">
                        <div class="card text-white bg-warning">
                            <div class="card-body">
                                <h6 class="card-title">Đang chờ</h6>
                                <h4 id="stat-pending">0</h4>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Transactions Table -->
                <div class="card">
                    <div class="card-body">
                        <div class="table-responsive">
                            <table class="table table-hover" id="transactions-table">
                                <thead>
                                    <tr>
                                        <th>Mã GD</th>
                                        <th>Người dùng</th>
                                        <th>Loại</th>
                                        <th>Số tiền</th>
                                        <th>Phương thức</th>
                                        <th>Trạng thái</th>
                                        <th>Đơn hàng</th>
                                        <th>Thời gian</th>
                                        <th>Thao tác</th>
                                    </tr>
                                </thead>
                                <tbody id="transactions-tbody">
                                    <tr>
                                        <td colspan="9" class="text-center text-muted">
                                            <i class="bi bi-hourglass-split"></i> Đang tải dữ liệu...
                                        </td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                        <!-- Pagination -->
                        <nav aria-label="Page navigation">
                            <ul class="pagination justify-content-center" id="pagination">
                                <!-- Pagination will be generated by JS -->
                            </ul>
                        </nav>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <div id="footer-container"></div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/api.js"></script>
    <script src="/js/common.js"></script>
    <script src="/js/admin-transactions.js"></script>
</body>
</html>
