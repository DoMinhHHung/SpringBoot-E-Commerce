<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản lý Sản phẩm - Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/css/style.css" rel="stylesheet">
</head>
<body>
    <div id="header-container"></div>

        <main class="container my-5">
                <h1>Quản lý Sản phẩm</h1>
                <div class="mb-3 d-flex justify-content-between align-items-center">
                        <div>
                                <button id="btn-new-product" class="btn btn-primary">Thêm sản phẩm mới</button>
                                <button id="btn-refresh-products" class="btn btn-secondary ms-2">Tải lại</button>
                        </div>
                        <div>
                                <input id="admin-search" class="form-control" style="width:300px; display:inline-block;" placeholder="Tìm theo tên...">
                        </div>
                </div>

                <div id="products-table" class="table-responsive">
                        <table class="table table-striped">
                                <thead>
                                        <tr>
                                                <th>ID</th>
                                                <th>Hình</th>
                                                <th>Tên</th>
                                                <th>Giá</th>
                                                <th>Giá sau KM</th>
                                                <th>Hành động</th>
                                        </tr>
                                </thead>
                                <tbody id="products-tbody">
                                        <!-- rows -->
                                </tbody>
                        </table>
                </div>
        </main>

        <!-- Product Modal -->
        <div class="modal fade" id="productModal" tabindex="-1" aria-hidden="true">
            <div class="modal-dialog modal-lg">
                <div class="modal-content">
                    <div class="modal-header">
                        <h5 class="modal-title" id="productModalTitle">Thêm sản phẩm</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                    </div>
                    <div class="modal-body">
                        <form id="product-form">
                            <input type="hidden" id="product-id">
                            <div class="mb-3">
                                <label class="form-label">Tên</label>
                                <input id="product-name" class="form-control" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Thương hiệu</label>
                                <input id="product-brand" class="form-control">
                            </div>
                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label class="form-label">Giá</label>
                                    <input id="product-price" type="number" step="0.01" class="form-control" required>
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label class="form-label">Tồn kho</label>
                                    <input id="product-stock" type="number" class="form-control">
                                </div>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Loại</label>
                                <select id="product-type" class="form-select">
                                    <option value="LAPTOP">LAPTOP</option>
                                    <option value="PC">PC</option>
                                    <option value="KEYBOARD">KEYBOARD</option>
                                    <option value="MOUSE">MOUSE</option>
                                    <option value="MONITOR">MONITOR</option>
                                    <option value="HEADPHONE">HEADPHONE</option>
                                    <option value="ACCESSORY">ACCESSORY</option>
                                </select>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Mô tả</label>
                                <textarea id="product-description" class="form-control" rows="3"></textarea>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Ảnh chính</label>
                                <input id="product-main-image" type="file" class="form-control" accept="image/*">
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Ảnh khác (multiple)</label>
                                <input id="product-images" type="file" class="form-control" accept="image/*" multiple>
                            </div>
                        </form>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Đóng</button>
                        <button id="product-save-btn" type="button" class="btn btn-primary">Lưu</button>
                    </div>
                </div>
            </div>
        </div>

    <div id="footer-container"></div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/api.js"></script>
    <script src="/js/common.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async function() {
            // auth check
            if (!apiClient || !apiClient.isAuthenticated()) {
                window.location.href = '/login.html?redirect=' + encodeURIComponent(window.location.pathname);
                return;
            }

            const user = await apiClient.getProfile();
            if (!user) { window.location.href = '/login.html'; return; }
            if (Array.isArray(user.role) ? user.role.indexOf('ADMIN') === -1 && user.role.indexOf('ROLE_ADMIN') === -1 : user.role !== 'ADMIN' && user.role !== 'ROLE_ADMIN') {
                alert('Không có quyền'); window.location.href = '/index.html'; return;
            }

            const productModalEl = document.getElementById('productModal');
            const productModal = new bootstrap.Modal(productModalEl);

            document.getElementById('btn-new-product').addEventListener('click', () => openNewProductModal(productModal));
            document.getElementById('btn-refresh-products').addEventListener('click', loadProducts);
            document.getElementById('product-save-btn').addEventListener('click', () => submitProductForm(productModal));
            document.getElementById('admin-search').addEventListener('input', (e) => renderFiltered(e.target.value));

            let productsCache = [];

            async function loadProducts() {
                try {
                    const products = await apiClient.getAllProducts();
                    productsCache = products || [];
                    renderProducts(productsCache);
                } catch (err) {
                    console.error(err);
                    showAlert('Lỗi tải sản phẩm: ' + (err.message || err), 'error');
                }
            }

            function renderProducts(products) {
                const tbody = document.getElementById('products-tbody');
                tbody.innerHTML = '';
                if (!products || products.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="6" class="text-muted">Không có sản phẩm</td></tr>';
                    return;
                }

                products.forEach(p => {
                    const tr = document.createElement('tr');
                    tr.innerHTML = `
                        <td>${p.id}</td>
                        <td>${p.mainImage ? `<img src="${p.mainImage}" alt="img" style="height:50px; object-fit:cover;">` : ''}</td>
                        <td>${p.name || ''}</td>
                        <td>${p.price ? formatPrice(p.price) : ''}</td>
                        <td>${p.priceAfterDiscount ? formatPrice(p.priceAfterDiscount) : '-'}</td>
                        <td>
                            <button class="btn btn-sm btn-primary me-1" data-id="${p.id}" data-action="edit">Sửa</button>
                            <button class="btn btn-sm btn-danger" data-id="${p.id}" data-action="delete">Xóa</button>
                        </td>
                    `;

                    tbody.appendChild(tr);
                });

                // attach handlers
                tbody.querySelectorAll('button[data-action="edit"]').forEach(btn => {
                    btn.addEventListener('click', (e) => openEditProductModal(e.target.getAttribute('data-id'), productModal));
                });
                tbody.querySelectorAll('button[data-action="delete"]').forEach(btn => {
                    btn.addEventListener('click', (e) => deleteProduct(e.target.getAttribute('data-id')));
                });
            }

            function renderFiltered(term) {
                const q = (term || '').toLowerCase().trim();
                if (!q) return renderProducts(productsCache);
                const filtered = productsCache.filter(p => (p.name || '').toLowerCase().includes(q));
                renderProducts(filtered);
            }

            function openNewProductModal(modal) {
                document.getElementById('product-form').reset();
                document.getElementById('product-id').value = '';
                document.getElementById('productModalTitle').textContent = 'Thêm sản phẩm';
                modal.show();
            }

            async function openEditProductModal(id, modal) {
                try {
                    const detail = await apiClient.getProductById(id);
                    document.getElementById('product-id').value = detail.id || '';
                    document.getElementById('product-name').value = detail.name || '';
                    document.getElementById('product-brand').value = detail.brand || '';
                    document.getElementById('product-price').value = detail.price || '';
                    document.getElementById('product-stock').value = detail.stock || '';
                    document.getElementById('product-description').value = detail.description || '';
                    if (detail.productType) document.getElementById('product-type').value = detail.productType;
                    document.getElementById('productModalTitle').textContent = 'Chỉnh sửa sản phẩm';
                    modal.show();
                } catch (err) {
                    console.error(err);
                    showAlert('Lỗi tải chi tiết sản phẩm', 'error');
                }
            }

            async function submitProductForm(modal) {
                const id = document.getElementById('product-id').value;
                const name = document.getElementById('product-name').value;
                const brand = document.getElementById('product-brand').value;
                const price = document.getElementById('product-price').value;
                const stock = document.getElementById('product-stock').value;
                const productType = document.getElementById('product-type').value;
                const description = document.getElementById('product-description').value;
                const mainImageInput = document.getElementById('product-main-image');
                const imagesInput = document.getElementById('product-images');

                const formData = new FormData();
                formData.append('name', name);
                if (brand) formData.append('brand', brand);
                if (price) formData.append('price', price);
                if (stock) formData.append('stock', stock);
                if (productType) formData.append('productType', productType);
                if (description) formData.append('description', description);
                if (mainImageInput && mainImageInput.files && mainImageInput.files[0]) {
                    formData.append('mainImage', mainImageInput.files[0]);
                }
                if (imagesInput && imagesInput.files && imagesInput.files.length > 0) {
                    for (let i = 0; i < imagesInput.files.length; i++) {
                        formData.append('images', imagesInput.files[i]);
                    }
                }

                try {
                    document.getElementById('product-save-btn').disabled = true;
                    if (id) {
                        await apiClient.adminUpdateProduct(id, formData);
                        showAlert('Cập nhật sản phẩm thành công', 'success');
                    } else {
                        await apiClient.adminCreateProduct(formData);
                        showAlert('Tạo sản phẩm thành công', 'success');
                    }
                    modal.hide();
                    await loadProducts();
                } catch (err) {
                    console.error(err);
                    showAlert('Lỗi lưu sản phẩm: ' + (err.message || err), 'error');
                } finally {
                    document.getElementById('product-save-btn').disabled = false;
                }
            }

            async function deleteProduct(id) {
                if (!confirm('Bạn có chắc muốn xóa sản phẩm #' + id + '?')) return;
                try {
                    await apiClient.request(`/products/${id}`, { method: 'DELETE' });
                    showAlert('Xóa sản phẩm thành công', 'success');
                    await loadProducts();
                } catch (err) {
                    console.error(err);
                    showAlert('Lỗi xóa sản phẩm: ' + (err.message || err), 'error');
                }
            }

            // initial load
            await loadProducts();
        });
    </script>
</body>
</html>
