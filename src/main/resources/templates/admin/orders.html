<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản lý Đơn hàng - Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <link href="/css/style.css" rel="stylesheet">
</head>
<body>
    <div id="header-container"></div>

    <main class="container my-5">
        <h1><i class="bi bi-box-seam"></i> Quản lý Đơn hàng</h1>
        <p id="admin-welcome" class="text-muted"></p>

        <div class="row">
            <!-- Sidebar Menu -->
            <div class="col-md-3">
                <div class="list-group">
                    <a href="/admin/dashboard.html" class="list-group-item list-group-item-action">Tổng quan</a>
                    <a href="/admin/products.html" class="list-group-item list-group-item-action">Sản phẩm</a>
                    <a href="/admin/promotions.html" class="list-group-item list-group-item-action">Khuyến mãi</a>
                    <a href="/admin/users.html" class="list-group-item list-group-item-action">Người dùng</a>
                    <a href="/admin/orders.html" class="list-group-item list-group-item-action active">Đơn hàng</a>
                    <a href="/admin/transactions.html" class="list-group-item list-group-item-action">Lịch sử giao dịch</a>
                    <a href="/admin/support.html" class="list-group-item list-group-item-action">Hỗ trợ trực tuyến</a>
                </div>
            </div>

            <!-- Main Content -->
            <div class="col-md-9">
                <!-- Filters -->
                <div class="card mb-3">
                    <div class="card-body">
                        <div class="row g-3">
                            <div class="col-md-4">
                                <label class="form-label">Lọc theo trạng thái</label>
                                <select id="filter-status" class="form-select">
                                    <option value="">Tất cả</option>
                                    <option value="PENDING">Đang chờ xác nhận</option>
                                    <option value="CONFIRMED">Đã xác nhận</option>
                                    <option value="PROCESSING">Đang xử lý</option>
                                    <option value="SHIPPED">Đang vận chuyển</option>
                                    <option value="DELIVERED">Đã nhận hàng</option>
                                    <option value="CANCELLED">Đã hủy</option>
                                </select>
                            </div>
                            <div class="col-md-4">
                                <label class="form-label">&nbsp;</label>
                                <div>
                                    <button id="btn-apply-filter" class="btn btn-primary">
                                        <i class="bi bi-funnel"></i> Áp dụng
                                    </button>
                                    <button id="btn-reset-filter" class="btn btn-secondary">
                                        <i class="bi bi-arrow-counterclockwise"></i> Reset
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Orders Table -->
                <div class="card">
                    <div class="card-body">
                        <div class="table-responsive">
                            <table class="table table-hover">
                                <thead>
                                    <tr>
                                        <th>Mã đơn hàng</th>
                                        <th>Khách hàng</th>
                                        <th>Số lượng SP</th>
                                        <th>Tổng tiền</th>
                                        <th>Trạng thái</th>
                                        <th>Ngày đặt</th>
                                        <th>Thao tác</th>
                                    </tr>
                                </thead>
                                <tbody id="orders-tbody">
                                    <tr>
                                        <td colspan="7" class="text-center text-muted">
                                            <i class="bi bi-hourglass-split"></i> Đang tải dữ liệu...
                                        </td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                        <!-- Pagination -->
                        <nav aria-label="Page navigation" class="mt-3">
                            <ul class="pagination justify-content-center" id="pagination">
                                <!-- Pagination will be generated by JS -->
                            </ul>
                        </nav>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Update Status Modal -->
    <div class="modal fade" id="updateStatusModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Cập nhật trạng thái đơn hàng</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <input type="hidden" id="update-order-code">
                    <div class="mb-3">
                        <label class="form-label">Trạng thái hiện tại</label>
                        <input type="text" class="form-control" id="current-status" readonly>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Trạng thái mới <span class="text-danger">*</span></label>
                        <select id="new-status" class="form-select" required>
                            <option value="">-- Chọn trạng thái --</option>
                            <option value="PENDING">Đang chờ xác nhận</option>
                            <option value="CONFIRMED">Đã xác nhận</option>
                            <option value="PROCESSING">Đang xử lý</option>
                            <option value="SHIPPED">Đang vận chuyển</option>
                            <option value="DELIVERED">Đã nhận hàng</option>
                            <option value="CANCELLED">Đã hủy</option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Ghi chú (tùy chọn)</label>
                        <textarea id="update-notes" class="form-control" rows="3" 
                                  placeholder="Nhập ghi chú về việc thay đổi trạng thái..."></textarea>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Hủy</button>
                    <button type="button" class="btn btn-primary" id="btn-confirm-update">
                        <i class="bi bi-check-circle"></i> Cập nhật
                    </button>
                </div>
            </div>
        </div>
    </div>

    <div id="footer-container"></div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/api.js"></script>
    <script src="/js/common.js"></script>
    <script src="/js/admin-orders.js"></script>
</body>
</html>
