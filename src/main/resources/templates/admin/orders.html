<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản lý Đơn hàng - Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/css/style.css" rel="stylesheet">
</head>
<body>
    <div id="header-container"></div>

    <main class="container my-5">
        <h1>Quản lý Đơn hàng</h1>
        <div class="mb-3">
            <button id="btn-refresh-orders" class="btn btn-secondary">Tải lại</button>
        </div>
        <div id="orders-table" class="table-responsive">
            <p class="text-muted">Danh sách đơn hàng sẽ hiển thị ở đây (API chưa implement)</p>
        </div>
    </main>

    <div id="footer-container"></div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/api.js"></script>
    <script src="/js/common.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async function() {
            if (!apiClient || !apiClient.isAuthenticated()) {
                window.location.href = '/login.html?redirect=' + encodeURIComponent(window.location.pathname);
                return;
            }
            const user = await apiClient.getProfile();
            if (!user) { window.location.href = '/login.html'; return; }
            if (Array.isArray(user.role) ? user.role.indexOf('ADMIN') === -1 && user.role.indexOf('ROLE_ADMIN') === -1 : user.role !== 'ADMIN' && user.role !== 'ROLE_ADMIN') { alert('Không có quyền'); window.location.href = '/index.html'; return; }

            // TODO: fetch danh sách đơn hàng từ API và render bảng
        });
    </script>
</body>
</html>
