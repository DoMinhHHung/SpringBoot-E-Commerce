<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản lý Đơn hàng - Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <link href="/css/style.css" rel="stylesheet">
</head>
<body>
    <!-- Admin Navbar -->
    <nav class="admin-navbar">
        <div class="admin-navbar-content">
            <div class="admin-navbar-brand">
                <button id="mobile-menu-btn" class="btn btn-sm">
                    <i class="bi bi-list"></i>
                </button>
                <i class="bi bi-shield-check"></i>
                <span>Admin Panel</span>
            </div>
            <div class="admin-navbar-user">
                <span id="admin-user-name"></span>
                <a href="/index.html" class="btn btn-sm btn-outline-light ms-2">
                    <i class="bi bi-house"></i> <span class="d-none d-md-inline">Về trang chủ</span>
                </a>
                <a href="#" onclick="adminLogout(); return false;" class="btn btn-sm btn-outline-light ms-2">
                    <i class="bi bi-box-arrow-right"></i> <span class="d-none d-md-inline">Đăng xuất</span>
                </a>
            </div>
        </div>
    </nav>

    <div class="admin-container">
        <!-- Sidebar -->
        <aside class="admin-sidebar" id="admin-sidebar">
            <nav class="admin-sidebar-nav">
                <a href="/admin/dashboard.html" class="admin-sidebar-item" data-page="dashboard">
                    <i class="bi bi-speedometer2"></i>
                    <span>Tổng quan</span>
                </a>
                <a href="/admin/products.html" class="admin-sidebar-item" data-page="products">
                    <i class="bi bi-box-seam"></i>
                    <span>Sản phẩm</span>
                </a>
                <a href="/admin/promotions.html" class="admin-sidebar-item" data-page="promotions">
                    <i class="bi bi-tag"></i>
                    <span>Khuyến mãi</span>
                </a>
                <a href="/admin/users.html" class="admin-sidebar-item" data-page="users">
                    <i class="bi bi-people"></i>
                    <span>Người dùng</span>
                </a>
                <a href="/admin/permissions.html" class="admin-sidebar-item" data-page="permissions">
                    <i class="bi bi-shield-lock"></i>
                    <span>Phân quyền</span>
                </a>
                <a href="/admin/orders.html" class="admin-sidebar-item active" data-page="orders">
                    <i class="bi bi-cart-check"></i>
                    <span>Đơn hàng</span>
                </a>
                <a href="/admin/transactions.html" class="admin-sidebar-item" data-page="transactions">
                    <i class="bi bi-wallet2"></i>
                    <span>Giao dịch</span>
                </a>
                <a href="/admin/support.html" class="admin-sidebar-item" data-page="support">
                    <i class="bi bi-chat-dots"></i>
                    <span>Hỗ trợ</span>
                </a>
            </nav>
            <button class="admin-sidebar-toggle d-md-none" id="sidebar-toggle">
                <i class="bi bi-x-lg"></i>
            </button>
        </aside>

        <!-- Main Content -->
        <main class="admin-main">
            <div class="admin-content">
                <div class="admin-page-header">
                    <h1><i class="bi bi-cart-check"></i> Quản lý Đơn hàng</h1>
                </div>
                <!-- Filters -->
                <div class="card mb-3">
                    <div class="card-body">
                        <div class="row g-3">
                            <div class="col-md-4">
                                <label class="form-label">Lọc theo trạng thái</label>
                                <select id="filter-status" class="form-select">
                                    <option value="">Tất cả</option>
                                    <option value="PENDING">Đang chờ xác nhận</option>
                                    <option value="CONFIRMED">Đã xác nhận</option>
                                    <option value="PROCESSING">Đang xử lý</option>
                                    <option value="SHIPPED">Đang vận chuyển</option>
                                    <option value="DELIVERED">Đã nhận hàng</option>
                                    <option value="CANCELLED">Đã hủy</option>
                                </select>
                            </div>
                            <div class="col-md-4">
                                <label class="form-label">&nbsp;</label>
                                <div>
                                    <button id="btn-apply-filter" class="btn btn-primary">
                                        <i class="bi bi-funnel"></i> Áp dụng
                                    </button>
                                    <button id="btn-reset-filter" class="btn btn-secondary">
                                        <i class="bi bi-arrow-counterclockwise"></i> Reset
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Orders Table -->
                <div class="card">
                    <div class="card-body">
                        <div class="table-responsive">
                            <table class="table table-hover">
                                <thead>
                                    <tr>
                                        <th>Mã đơn hàng</th>
                                        <th>Khách hàng</th>
                                        <th>Số lượng SP</th>
                                        <th>Tổng tiền</th>
                                        <th>Trạng thái</th>
                                        <th>Ngày đặt</th>
                                        <th>Thao tác</th>
                                    </tr>
                                </thead>
                                <tbody id="orders-tbody">
                                    <tr>
                                        <td colspan="7" class="text-center text-muted">
                                            <i class="bi bi-hourglass-split"></i> Đang tải dữ liệu...
                                        </td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                        <!-- Pagination -->
                        <nav aria-label="Page navigation" class="mt-3">
                            <ul class="pagination justify-content-center" id="pagination">
                                <!-- Pagination will be generated by JS -->
                            </ul>
                        </nav>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Update Status Modal -->
    <div class="modal fade" id="updateStatusModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Cập nhật trạng thái đơn hàng</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <input type="hidden" id="update-order-code">
                    <div class="mb-3">
                        <label class="form-label">Trạng thái hiện tại</label>
                        <input type="text" class="form-control" id="current-status" readonly>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Trạng thái mới <span class="text-danger">*</span></label>
                        <select id="new-status" class="form-select" required>
                            <option value="">-- Chọn trạng thái --</option>
                            <option value="PENDING">Đang chờ xác nhận</option>
                            <option value="CONFIRMED">Đã xác nhận</option>
                            <option value="PROCESSING">Đang xử lý</option>
                            <option value="SHIPPED">Đang vận chuyển</option>
                            <option value="DELIVERED">Đã nhận hàng</option>
                            <option value="CANCELLED">Đã hủy</option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Ghi chú (tùy chọn)</label>
                        <textarea id="update-notes" class="form-control" rows="3" 
                                  placeholder="Nhập ghi chú về việc thay đổi trạng thái..."></textarea>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Hủy</button>
                    <button type="button" class="btn btn-primary" id="btn-confirm-update">
                        <i class="bi bi-check-circle"></i> Cập nhật
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/api.js"></script>
    <script src="/js/common.js"></script>
    <script src="/js/admin-common.js"></script>
    <script src="/js/admin-orders.js"></script>
</body>
</html>
