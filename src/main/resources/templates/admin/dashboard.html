<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin Dashboard - E-Commerce</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
      <link href="/css/style.css" rel="stylesheet" />
  </head>
  <body>
    <div id="header-container"></div>

    <main class="container my-5">
      <h1>Admin Dashboard</h1>
      <p id="admin-welcome" class="text-muted"></p>

      <div class="row">
        <div class="col-md-3">
          <div class="list-group">
            <a
              href="/admin/dashboard.html"
              class="list-group-item list-group-item-action active"
              >Tổng quan</a
            >
            <a
              href="/admin/products.html"
              class="list-group-item list-group-item-action"
              >Sản phẩm</a
            >
            <a
              href="/admin/promotions.html"
              class="list-group-item list-group-item-action"
              >Khuyến mãi</a
            >
            <a
              href="/admin/users.html"
              class="list-group-item list-group-item-action"
              >Người dùng</a
            >
            <a
              href="/admin/orders.html"
              class="list-group-item list-group-item-action"
              >Đơn hàng</a
            >
          </div>
        </div>
        <div class="col-md-9">
          <div id="admin-content">
            <div class="card mb-3">
              <div class="card-body">
                <h5 class="card-title">Thống kê nhanh</h5>
                <p class="card-text">
                  Số sản phẩm: <span id="stat-products">-</span>
                </p>
                <p class="card-text">
                  Số người dùng: <span id="stat-users">-</span>
                </p>
              </div>
            </div>
          </div>
        </div>
      </div>
    </main>

    <div id="footer-container"></div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/api.js"></script>
    <script src="/js/common.js"></script>
    <script>
      document.addEventListener("DOMContentLoaded", async function () {
        if (!apiClient || !apiClient.isAuthenticated()) {
          window.location.href =
            "/login.html?redirect=" +
            encodeURIComponent(window.location.pathname);
          return;
        }

        try {
          const user = await apiClient.getProfile();
          if (!user) {
            window.location.href = "/login.html";
            return;
          }
          if (
            Array.isArray(user.role)
              ? user.role.indexOf("ADMIN") === -1 &&
                user.role.indexOf("ROLE_ADMIN") === -1
              : user.role !== "ADMIN" && user.role !== "ROLE_ADMIN"
          ) {
            alert("Không có quyền truy cập trang quản trị");
            window.location.href = "/index.html";
            return;
          }
          document.getElementById("admin-welcome").textContent =
            "Xin chào, " + (user.fullName || user.email);
          // TODO: fetch statistics from API
        } catch (err) {
          console.error(err);
          alert("Lỗi tải dữ liệu: " + (err.message || err));
        }
      });
    </script>
  </body>
</html>
