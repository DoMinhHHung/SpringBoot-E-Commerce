<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin Dashboard - E-Commerce</title>
    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
            rel="stylesheet"
    />
    <link href="/css/style.css" rel="stylesheet" />
</head>
<body>
<div id="header-container"></div>

<main class="container my-5">
    <h1>Admin Dashboard</h1>
    <p id="admin-welcome" class="text-muted"></p>

    <div class="row">
        <div class="col-md-3">
            <div class="list-group">
                <a
                        href="/admin/dashboard.html"
                        class="list-group-item list-group-item-action active"
                >Tổng quan</a
                >
                <a
                        href="/admin/products.html"
                        class="list-group-item list-group-item-action"
                >Sản phẩm</a
                >
                <a
                        href="/admin/promotions.html"
                        class="list-group-item list-group-item-action"
                >Khuyến mãi</a
                >
                <a
                        href="/admin/users.html"
                        class="list-group-item list-group-item-action"
                >Người dùng</a
                >
                <a
                        href="/admin/orders.html"
                        class="list-group-item list-group-item-action"
                >Đơn hàng</a
                >
            </div>
        </div>
        <div class="col-md-9">
            <div id="admin-content">
                <div class="d-flex flex-column flex-md-row justify-content-between align-items-md-center gap-3 mb-3">
                    <div>
                        <h5 class="mb-1">Thống kê kinh doanh</h5>
                        <p class="text-muted mb-0">
                            Khoảng thời gian: <span id="stat-range">-</span>
                        </p>
                    </div>
                    <div class="d-flex align-items-center gap-2">
                        <label for="period-select" class="fw-semibold mb-0">Chọn kỳ:</label>
                        <select id="period-select" class="form-select">
                            <option value="day">Hôm nay</option>
                            <option value="week">Tuần này</option>
                            <option value="month">Tháng này</option>
                            <option value="quarter">Quý này</option>
                            <option value="year">Năm nay</option>
                        </select>
                    </div>
                </div>

                <div class="row g-3">
                    <div class="col-md-6 col-lg-3">
                        <div class="card h-100">
                            <div class="card-body">
                                <div class="d-flex justify-content-between align-items-center">
                                    <span class="text-muted">Doanh số</span>
                                    <span class="badge bg-success">VND</span>
                                </div>
                                <h4 id="stat-revenue" class="mt-2 mb-0">-</h4>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-6 col-lg-3">
                        <div class="card h-100">
                            <div class="card-body">
                                <span class="text-muted">Số lượng người mua</span>
                                <h4 id="stat-buyers" class="mt-2 mb-0">-</h4>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-6 col-lg-3">
                        <div class="card h-100">
                            <div class="card-body">
                                <span class="text-muted">Tài khoản mới</span>
                                <h4 id="stat-new-customers" class="mt-2 mb-0">-</h4>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-6 col-lg-3">
                        <div class="card h-100">
                            <div class="card-body">
                                <span class="text-muted">Sản phẩm đã bán</span>
                                <h4 id="stat-products-sold" class="mt-2 mb-0">-</h4>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="mt-3 text-danger" id="stat-error" style="display: none;"></div>
            </div>
        </div>
    </div>
</main>

<div id="footer-container"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/api.js"></script>
<script src="/js/common.js"></script>
<script>
    document.addEventListener("DOMContentLoaded", async function () {
        if (!apiClient || !apiClient.isAuthenticated()) {
            window.location.href =
                "/login.html?redirect=" +
                encodeURIComponent(window.location.pathname);
            return;
        }

        try {
            const user = await apiClient.getProfile();
            if (!user) {
                window.location.href = "/login.html";
                return;
            }
            if (
                Array.isArray(user.role)
                    ? user.role.indexOf("ADMIN") === -1 &&
                    user.role.indexOf("ROLE_ADMIN") === -1
                    : user.role !== "ADMIN" && user.role !== "ROLE_ADMIN"
            ) {
                alert("Không có quyền truy cập trang quản trị");
                window.location.href = "/index.html";
                return;
            }
            document.getElementById("admin-welcome").textContent =
                "Xin chào, " + (user.fullName || user.email);

            const periodSelect = document.getElementById("period-select");
            const statRevenue = document.getElementById("stat-revenue");
            const statBuyers = document.getElementById("stat-buyers");
            const statNewCustomers = document.getElementById("stat-new-customers");
            const statProductsSold = document.getElementById("stat-products-sold");
            const statRange = document.getElementById("stat-range");
            const statError = document.getElementById("stat-error");

            function setLoadingState() {
                [statRevenue, statBuyers, statNewCustomers, statProductsSold].forEach(el => el.textContent = "Đang tải...");
                statError.style.display = "none";
            }

            function formatRange(start, end) {
                const startDate = start ? new Date(start) : null;
                const endDate = end ? new Date(new Date(end).getTime() - 1000) : null;
                if (!startDate || !endDate) return "-";
                const startStr = startDate.toLocaleDateString("vi-VN");
                const endStr = endDate.toLocaleDateString("vi-VN");
                return `${startStr} - ${endStr}`;
            }

            async function loadStatistics() {
                try {
                    setLoadingState();
                    const period = periodSelect.value;
                    const data = await apiClient.getAdminStatistics(period);
                    statRevenue.textContent = formatPrice(data?.revenue || 0);
                    statBuyers.textContent = data?.buyerCount ?? 0;
                    statNewCustomers.textContent = data?.newCustomers ?? 0;
                    statProductsSold.textContent = data?.productsSold ?? 0;
                    statRange.textContent = formatRange(data?.startDate, data?.endDate);
                } catch (err) {
                    console.error(err);
                    statError.textContent = "Không thể tải thống kê: " + (err.message || err);
                    statError.style.display = "block";
                    showAlert("Không thể tải thống kê: " + (err.message || err), "danger");
                }
            }

            periodSelect.addEventListener("change", loadStatistics);
            loadStatistics();
        } catch (err) {
            console.error(err);
            alert("Lỗi tải dữ liệu: " + (err.message || err));
        }
    });
</script>
</body>
</html>
