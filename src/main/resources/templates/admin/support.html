<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hỗ trợ trực tuyến</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/stompjs@2.3.3/lib/stomp.min.js"></script>
</head>
<body class="container py-4">
    <h3>Hỗ trợ trực tuyến <small class="text-muted" id="conn-status">Đang kết nối...</small></h3>
    <div class="row mt-3">
        <div class="col-md-4">
            <h5>Yêu cầu đang chờ</h5>
            <ul id="pending-list" class="list-group"></ul>
        </div>
        <div class="col-md-8">
            <div class="d-flex align-items-center mb-2">
                <strong>Phiên đang chat:</strong>
                <span class="ms-2 badge bg-info" id="active-session">(chưa chọn)</span>
            </div>
            <div id="chat-box" style="height: 420px; overflow:auto; border:1px solid #e5e5e5; border-radius:6px; padding:12px;"></div>
            <form id="send-form" class="mt-2 d-flex gap-2">
                <input id="send-input" class="form-control" placeholder="Nhập câu trả lời..." />
                <button class="btn btn-primary" type="submit">Gửi</button>
                <button class="btn btn-outline-danger" id="end-session" type="button">Kết thúc</button>
            </form>
        </div>
    </div>

    <script src="/js/admin-support.js"></script>
</body>
</html>
