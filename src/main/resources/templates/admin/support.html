<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hỗ trợ trực tuyến - Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <link href="/css/style.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/stompjs@2.3.3/lib/stomp.min.js"></script>
</head>
<body>
    <!-- Admin Navbar -->
    <nav class="admin-navbar">
        <div class="admin-navbar-content">
            <div class="admin-navbar-brand">
                <button id="mobile-menu-btn" class="btn btn-sm">
                    <i class="bi bi-list"></i>
                </button>
                <i class="bi bi-shield-check"></i>
                <span>Admin Panel</span>
            </div>
            <div class="admin-navbar-user">
                <span id="admin-user-name"></span>
                <a href="/index.html" class="btn btn-sm btn-outline-light ms-2">
                    <i class="bi bi-house"></i> <span class="d-none d-md-inline">Về trang chủ</span>
                </a>
                <a href="#" onclick="adminLogout(); return false;" class="btn btn-sm btn-outline-light ms-2">
                    <i class="bi bi-box-arrow-right"></i> <span class="d-none d-md-inline">Đăng xuất</span>
                </a>
            </div>
        </div>
    </nav>

    <div class="admin-container">
        <!-- Sidebar -->
        <aside class="admin-sidebar" id="admin-sidebar">
            <nav class="admin-sidebar-nav">
                <a href="/admin/dashboard.html" class="admin-sidebar-item" data-page="dashboard">
                    <i class="bi bi-speedometer2"></i>
                    <span>Tổng quan</span>
                </a>
                <a href="/admin/products.html" class="admin-sidebar-item" data-page="products">
                    <i class="bi bi-box-seam"></i>
                    <span>Sản phẩm</span>
                </a>
                <a href="/admin/promotions.html" class="admin-sidebar-item" data-page="promotions">
                    <i class="bi bi-tag"></i>
                    <span>Khuyến mãi</span>
                </a>
                <a href="/admin/users.html" class="admin-sidebar-item" data-page="users">
                    <i class="bi bi-people"></i>
                    <span>Người dùng</span>
                </a>
                <a href="/admin/permissions.html" class="admin-sidebar-item" data-page="permissions">
                    <i class="bi bi-shield-lock"></i>
                    <span>Phân quyền</span>
                </a>
                <a href="/admin/orders.html" class="admin-sidebar-item" data-page="orders">
                    <i class="bi bi-cart-check"></i>
                    <span>Đơn hàng</span>
                </a>
                <a href="/admin/transactions.html" class="admin-sidebar-item" data-page="transactions">
                    <i class="bi bi-wallet2"></i>
                    <span>Giao dịch</span>
                </a>
                <a href="/admin/support.html" class="admin-sidebar-item active" data-page="support">
                    <i class="bi bi-chat-dots"></i>
                    <span>Hỗ trợ</span>
                </a>
            </nav>
            <button class="admin-sidebar-toggle d-md-none" id="sidebar-toggle">
                <i class="bi bi-x-lg"></i>
            </button>
        </aside>

        <!-- Main Content -->
        <main class="admin-main">
            <div class="admin-content">
                <div class="admin-page-header">
                    <h1><i class="bi bi-chat-dots"></i> Hỗ trợ trực tuyến</h1>
                    <small class="text-muted" id="conn-status">Đang kết nối...</small>
                </div>
                
                <div class="row mt-3">
                    <div class="col-md-4">
                        <h5>Yêu cầu đang chờ</h5>
                        <ul id="pending-list" class="list-group"></ul>
                    </div>
                    <div class="col-md-8">
                        <div class="d-flex align-items-center mb-2">
                            <strong>Phiên đang chat:</strong>
                            <span class="ms-2 badge bg-info" id="active-session">(chưa chọn)</span>
                        </div>
                        <div id="chat-box" style="height: 420px; overflow:auto; border:1px solid #e5e5e5; border-radius:6px; padding:12px;"></div>
                        <form id="send-form" class="mt-2 d-flex gap-2">
                            <input id="send-input" class="form-control" placeholder="Nhập câu trả lời..." />
                            <button class="btn btn-primary" type="submit">Gửi</button>
                            <button class="btn btn-outline-danger" id="end-session" type="button">Kết thúc</button>
                        </form>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/api.js"></script>
    <script src="/js/common.js"></script>
    <script src="/js/admin-common.js"></script>
    <script src="/js/admin-support.js"></script>
</body>
</html>
