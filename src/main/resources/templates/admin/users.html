<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản lý Người dùng - Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <link href="/css/style.css" rel="stylesheet">
</head>
<body>
    <!-- Admin Navbar -->
    <nav class="admin-navbar">
        <div class="admin-navbar-content">
            <div class="admin-navbar-brand">
                <button id="mobile-menu-btn" class="btn btn-sm">
                    <i class="bi bi-list"></i>
                </button>
                <i class="bi bi-shield-check"></i>
                <span>Admin Panel</span>
            </div>
            <div class="admin-navbar-user">
                <span id="admin-user-name"></span>
                <a href="/index.html" class="btn btn-sm btn-outline-light ms-2">
                    <i class="bi bi-house"></i> <span class="d-none d-md-inline">Về trang chủ</span>
                </a>
                <a href="#" onclick="adminLogout(); return false;" class="btn btn-sm btn-outline-light ms-2">
                    <i class="bi bi-box-arrow-right"></i> <span class="d-none d-md-inline">Đăng xuất</span>
                </a>
            </div>
        </div>
    </nav>

    <div class="admin-container">
        <!-- Sidebar -->
        <aside class="admin-sidebar" id="admin-sidebar">
            <nav class="admin-sidebar-nav">
                <a href="/admin/dashboard.html" class="admin-sidebar-item" data-page="dashboard">
                    <i class="bi bi-speedometer2"></i>
                    <span>Tổng quan</span>
                </a>
                <a href="/admin/products.html" class="admin-sidebar-item" data-page="products">
                    <i class="bi bi-box-seam"></i>
                    <span>Sản phẩm</span>
                </a>
                <a href="/admin/promotions.html" class="admin-sidebar-item" data-page="promotions">
                    <i class="bi bi-tag"></i>
                    <span>Khuyến mãi</span>
                </a>
                <a href="/admin/users.html" class="admin-sidebar-item active" data-page="users">
                    <i class="bi bi-people"></i>
                    <span>Người dùng</span>
                </a>
                <a href="/admin/permissions.html" class="admin-sidebar-item" data-page="permissions">
                    <i class="bi bi-shield-lock"></i>
                    <span>Phân quyền</span>
                </a>
                <a href="/admin/orders.html" class="admin-sidebar-item" data-page="orders">
                    <i class="bi bi-cart-check"></i>
                    <span>Đơn hàng</span>
                </a>
                <a href="/admin/transactions.html" class="admin-sidebar-item" data-page="transactions">
                    <i class="bi bi-wallet2"></i>
                    <span>Giao dịch</span>
                </a>
                <a href="/admin/support.html" class="admin-sidebar-item" data-page="support">
                    <i class="bi bi-chat-dots"></i>
                    <span>Hỗ trợ</span>
                </a>
            </nav>
            <button class="admin-sidebar-toggle d-md-none" id="sidebar-toggle">
                <i class="bi bi-x-lg"></i>
            </button>
        </aside>

        <!-- Main Content -->
        <main class="admin-main">
            <div class="admin-content">
                <div class="admin-page-header">
                    <h1><i class="bi bi-people"></i> Quản lý Người dùng</h1>
                </div>
                
                <div class="mb-3">
                    <button id="btn-refresh-users" class="btn btn-secondary">
                        <i class="bi bi-arrow-clockwise"></i> Tải lại
                    </button>
                </div>
                
                <div id="users-table" class="table-responsive">
                    <table class="table table-striped">
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Tên</th>
                                <th>Email</th>
                                <th>Vai trò</th>
                                <th>Trạng thái</th>
                                <th>Hành động</th>
                            </tr>
                        </thead>
                        <tbody id="users-tbody">
                            <tr>
                                <td colspan="6" class="text-center text-muted">
                                    <div class="spinner-border spinner-border-sm me-2" role="status"></div>
                                    Đang tải...
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/api.js"></script>
    <script src="/js/common.js"></script>
    <script src="/js/admin-common.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async function() {
            document.getElementById('btn-refresh-users').addEventListener('click', loadUsers);
            
            async function loadUsers() {
                try {
                    const users = await apiClient.request('/admin/permissions/users', { method: 'GET' });
                    renderUsers(users);
                } catch (err) {
                    console.error('Error loading users:', err);
                    document.getElementById('users-tbody').innerHTML = 
                        '<tr><td colspan="6" class="text-center text-danger">Lỗi tải dữ liệu</td></tr>';
                }
            }
            
            function renderUsers(users) {
                const tbody = document.getElementById('users-tbody');
                if (!users || users.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="6" class="text-center text-muted">Không có người dùng</td></tr>';
                    return;
                }
                
                tbody.innerHTML = users.map(user => `
                    <tr>
                        <td>${user.id}</td>
                        <td>${user.fullName || '-'}</td>
                        <td>${user.email || '-'}</td>
                        <td><span class="badge bg-info">${user.role || 'USER'}</span></td>
                        <td>
                            <span class="badge ${user.enabled ? 'bg-success' : 'bg-danger'}">
                                ${user.enabled ? 'Kích hoạt' : 'Chưa kích hoạt'}
                            </span>
                            ${user.banned ? '<span class="badge bg-warning text-dark ms-1">Bị chặn</span>' : ''}
                        </td>
                        <td>
                            <a href="/admin/permissions.html" class="btn btn-sm btn-outline-primary">
                                <i class="bi bi-shield-lock"></i> Phân quyền
                            </a>
                            <button class="btn btn-sm ms-1 ${user.banned ? 'btn-outline-success' : 'btn-outline-danger'} toggle-ban-btn" data-user-id="${user.id}">
                                <i class="bi ${user.banned ? 'bi-unlock' : 'bi-slash-circle'}"></i> ${user.banned ? 'Mở chặn' : 'Chặn'}
                            </button>
                        </td>
                    </tr>
                `).join('');

                // attach handlers
                document.querySelectorAll('.toggle-ban-btn').forEach(btn => {
                    btn.addEventListener('click', async function() {
                        const userId = this.getAttribute('data-user-id');
                        try {
                            if (this.textContent.trim().includes('Mở chặn')) {
                                await apiClient.request(`/admin/users/${userId}/unban`, { method: 'POST' });
                                showAlert('Mở chặn người dùng thành công', 'success');
                            } else {
                                // prompt reason
                                const reason = prompt('Lý do chặn (tùy chọn):');
                                await apiClient.request(`/admin/users/${userId}/ban?reason=` + encodeURIComponent(reason || ''), { method: 'POST' });
                                showAlert('Chặn người dùng thành công', 'success');
                            }
                            // reload users
                            await loadUsers();
                        } catch (e) {
                            console.error(e);
                            showAlert('Lỗi khi thay đổi trạng thái chặn: ' + (e.message || e), 'error');
                        }
                    });
                });
            }
            
            await loadUsers();
        });
    </script>
</body>
</html>
