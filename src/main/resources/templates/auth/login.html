<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập - E-Commerce</title>
    
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <!-- Custom CSS -->
    <link href="/css/style.css" rel="stylesheet">
</head>
<body class="bg-light">
    <!-- Header -->
    <div id="header-container"></div>

    <!-- Main Content -->
    <main class="container my-5">
        <div class="row justify-content-center">
            <div class="col-md-5">
                <div class="card shadow">
                    <div class="card-body p-5">
                        <h2 class="text-center mb-4">Đăng nhập</h2>
                        
                        <form id="login-form">
                            <div class="mb-3">
                                <label for="email" class="form-label">Email</label>
                                <input type="email" class="form-control" id="email" required>
                            </div>
                            
                            <div class="mb-3">
                                <label for="password" class="form-label">Mật khẩu</label>
                                <input type="password" class="form-control" id="password" required>
                            </div>
                            
                            <div class="mb-3 form-check">
                                <input type="checkbox" class="form-check-input" id="remember-me">
                                <label class="form-check-label" for="remember-me">
                                    Ghi nhớ đăng nhập
                                </label>
                            </div>
                            
                            <button type="submit" class="btn btn-primary-custom w-100 mb-3">
                                Đăng nhập
                            </button>
                            
                            <div class="text-center mb-3">
                                <a href="/forgot-password.html">Quên mật khẩu?</a>
                            </div>
                        </form>
                        
                        <hr>
                        
                        <!-- OAuth2 Google Login -->
                        <div class="text-center">
                            <p class="text-muted mb-3">Hoặc đăng nhập bằng</p>
                            <a href="/oauth2/authorization/google" class="btn btn-outline-danger w-100">
                                <i class="bi bi-google"></i> Đăng nhập với Google
                            </a>
                        </div>
                        
                        <hr>
                        
                        <div class="text-center">
                            <p>Chưa có tài khoản? <a href="/register.html">Đăng ký ngay</a></p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <div id="footer-container"></div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Common JS -->
    <script src="/js/common.js"></script>
    <!-- API Client -->
    <script src="/js/api.js"></script>
    <!-- Page Script -->
    <script>
        document.getElementById('login-form').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            
            const submitBtn = e.target.querySelector('button[type="submit"]');
            const originalText = submitBtn.innerHTML;
            submitBtn.disabled = true;
            submitBtn.innerHTML = '<span class="spinner-border spinner-border-sm"></span> Đang đăng nhập...';
            
            try {
                await apiClient.login(email, password);
                showAlert('Đăng nhập thành công!', 'success');
                
                // Get user profile
                const user = await apiClient.getProfile();
                apiClient.setUser(user);
                
                // Redirect
                const urlParams = new URLSearchParams(window.location.search);
                const redirect = urlParams.get('redirect') || '/index.html';
                setTimeout(() => {
                    window.location.href = redirect;
                }, 1000);
            } catch (error) {
                showAlert('Đăng nhập thất bại: ' + error.message, 'error');
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerHTML = originalText;
            }
        });

        // Check if already logged in
        if (apiClient.isAuthenticated()) {
            window.location.href = '/index.html';
        }
    </script>
</body>
</html>
