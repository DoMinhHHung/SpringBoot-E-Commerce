<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thanh toán thành công - E-Commerce</title>
    
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <!-- Custom CSS -->
    <link href="/css/style.css" rel="stylesheet">
</head>
<body>
    <!-- Header -->
    <div id="header-container"></div>

    <!-- Main Content -->
    <main class="container my-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card shadow">
                    <div class="card-body text-center py-5">
                        <div class="mb-4">
                            <i class="bi bi-check-circle-fill text-success" style="font-size: 5rem;"></i>
                        </div>
                        <h2 class="mb-3">Thanh toán thành công!</h2>
                        <p class="text-muted mb-4">Cảm ơn bạn đã mua hàng. Đơn hàng của bạn đang được xử lý.</p>
                        
                        <div id="order-info" class="mb-4">
                            <p class="mb-2">Mã đơn hàng: <strong id="order-code">-</strong></p>
                            <p class="mb-2">Tổng tiền: <strong id="total-amount" class="text-danger">-</strong></p>
                        </div>

                        <div class="d-grid gap-2">
                            <a href="/index.html" class="btn btn-primary btn-lg">
                                <i class="bi bi-house"></i> Về trang chủ
                            </a>
                            <a href="#" id="view-order-btn" class="btn btn-outline-secondary btn-lg">
                                <i class="bi bi-box-seam"></i> Xem đơn hàng
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <div id="footer-container"></div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Common JS -->
    <script src="/js/common.js"></script>
    <!-- API Client -->
    <script src="/js/api.js"></script>
    
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const urlParams = new URLSearchParams(window.location.search);
            const orderCode = urlParams.get('orderCode');
            
            if (orderCode) {
                document.getElementById('order-code').textContent = '#' + orderCode;
                
                // Set view order button link
                const viewOrderBtn = document.getElementById('view-order-btn');
                if (viewOrderBtn) {
                    viewOrderBtn.href = `/order-detail.html?orderCode=${orderCode}`;
                }
                
                // Fetch order details if authenticated
                if (apiClient && apiClient.isAuthenticated()) {
                    apiClient.getPaymentStatus(orderCode)
                        .then(response => {
                            if (response.totalAmount) {
                                document.getElementById('total-amount').textContent = formatPrice(response.totalAmount);
                            }
                        })
                        .catch(error => {
                            console.error('Error fetching order details:', error);
                        });
                }
            }
        });
    </script>
</body>
</html>
