<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tài khoản - E-Commerce</title>
    
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <!-- Custom CSS -->
    <link href="/css/style.css" rel="stylesheet">
</head>
<body>
    <!-- Header -->
    <div id="header-container"></div>

    <!-- Main Content -->
    <main class="container my-5">
        <div class="row">
            <!-- Sidebar -->
            <div class="col-md-3">
                <div class="card">
                    <div class="card-body">
                        <ul class="nav nav-pills flex-column">
                            <li class="nav-item">
                                <a class="nav-link active" data-bs-toggle="pill" href="#profile-info">
                                    <i class="bi bi-person"></i> Thông tin cá nhân
                                </a>
                            </li>
                            <li class="nav-item">
                                <a class="nav-link" data-bs-toggle="pill" href="#change-password">
                                    <i class="bi bi-lock"></i> Đổi mật khẩu
                                </a>
                            </li>
                            <li class="nav-item">
                                <a class="nav-link" data-bs-toggle="pill" href="#addresses" id="addresses-tab">
                                    <i class="bi bi-geo-alt"></i> Địa chỉ giao hàng
                                </a>
                            </li>
                        </ul>
                    </div>
                </div>
            </div>

            <!-- Main Content -->
            <div class="col-md-9">
                <!-- Loading -->
                <div id="loading-spinner" class="loading-spinner active">
                    <div class="spinner-border text-primary" role="status">
                        <span class="visually-hidden">Loading...</span>
                    </div>
                </div>

                <!-- Content -->
                <div id="content" class="d-none">
                    <div class="tab-content">
                        <!-- Profile Info Tab -->
                        <div class="tab-pane fade show active" id="profile-info">
                            <div class="card">
                                <div class="card-header">
                                    <h5 class="mb-0">Thông tin cá nhân</h5>
                                </div>
                                <div class="card-body">
                                    <form id="profile-form">
                                        <div class="row">
                                            <div class="col-md-6 mb-3">
                                                <label for="fullName" class="form-label">Họ và tên</label>
                                                <input type="text" class="form-control" id="fullName">
                                            </div>
                                            
                                            <div class="col-md-6 mb-3">
                                                <label for="phone" class="form-label">Số điện thoại</label>
                                                <input type="tel" class="form-control" id="phone">
                                            </div>
                                        </div>
                                        
                                        <div class="row">
                                            <div class="col-md-6 mb-3">
                                                <label for="email" class="form-label">Email</label>
                                                <input type="email" class="form-control" id="email" disabled>
                                                <div class="form-text">Email không thể thay đổi</div>
                                            </div>
                                            
                                            <div class="col-md-6 mb-3">
                                                <label for="gender" class="form-label">Giới tính</label>
                                                <select class="form-select" id="gender">
                                                    <option value="">Chọn giới tính</option>
                                                    <option value="MALE">Nam</option>
                                                    <option value="FEMALE">Nữ</option>
                                                    <option value="OTHER">Khác</option>
                                                </select>
                                            </div>
                                        </div>
                                        
                                        <div class="mb-3">
                                            <label for="dob" class="form-label">Ngày sinh</label>
                                            <input type="date" class="form-control" id="dob">
                                        </div>
                                        
                                        <div class="mb-3">
                                            <label class="form-label">Vai trò</label>
                                            <input type="text" class="form-control" id="role" disabled>
                                        </div>
                                        
                                        <button type="submit" class="btn btn-primary-custom">
                                            <i class="bi bi-save"></i> Lưu thay đổi
                                        </button>
                                    </form>
                                </div>
                            </div>
                        </div>

                        <!-- Change Password Tab -->
                        <div class="tab-pane fade" id="change-password">
                            <div class="card">
                                <div class="card-header">
                                    <h5 class="mb-0">Đổi mật khẩu</h5>
                                </div>
                                <div class="card-body">
                                    <form id="change-password-form">
                                        <div class="mb-3">
                                            <label for="oldPassword" class="form-label">Mật khẩu cũ</label>
                                            <input type="password" class="form-control" id="oldPassword" required>
                                        </div>
                                        
                                        <div class="mb-3">
                                            <label for="newPassword" class="form-label">Mật khẩu mới</label>
                                            <input type="password" class="form-control" id="newPassword" required minlength="6">
                                            <div class="form-text">Mật khẩu tối thiểu 6 ký tự</div>
                                        </div>
                                        
                                        <div class="mb-3">
                                            <label for="confirmNewPassword" class="form-label">Xác nhận mật khẩu mới</label>
                                            <input type="password" class="form-control" id="confirmNewPassword" required>
                                        </div>
                                        
                                        <button type="submit" class="btn btn-primary-custom">
                                            <i class="bi bi-key"></i> Đổi mật khẩu
                                        </button>
                                    </form>
                                </div>
                            </div>
                        </div>

                        <!-- Addresses Tab -->
                        <div class="tab-pane fade" id="addresses">
                            <div class="card">
                                <div class="card-header d-flex justify-content-between align-items-center">
                                    <h5 class="mb-0">Địa chỉ giao hàng</h5>
                                    <button class="btn btn-primary btn-sm" onclick="showAddressModal()">
                                        <i class="bi bi-plus-circle"></i> Thêm địa chỉ
                                    </button>
                                </div>
                                <div class="card-body">
                                    <div id="addresses-list">
                                        <!-- Addresses will be loaded here -->
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <div id="footer-container"></div>

    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <!-- Common JS -->
    <script src="/js/common.js"></script>
    <!-- API Client -->
    <script src="/js/api.js"></script>
    <!-- Map Picker -->
    <script src="/js/map-picker.js"></script>
    <!-- Address Form -->
    <script src="/js/address-form.js"></script>
    <!-- Page Script -->
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            if (!apiClient.isAuthenticated()) {
                window.location.href = '/login.html?redirect=' + encodeURIComponent(window.location.pathname);
                return;
            }
            
            loadProfile();
        });

        async function loadProfile() {
            document.getElementById('loading-spinner').classList.add('active');
            document.getElementById('content').classList.add('d-none');

            try {
                const user = await apiClient.getProfile();
                populateProfileForm(user);
                apiClient.setUser(user);
            } catch (error) {
                showAlert('Không thể tải thông tin: ' + error.message, 'error');
                if (error.message.includes('401')) {
                    setTimeout(() => window.location.href = '/login.html', 2000);
                }
            } finally {
                document.getElementById('loading-spinner').classList.remove('active');
                document.getElementById('content').classList.remove('d-none');
            }
        }

        function populateProfileForm(user) {
            document.getElementById('fullName').value = user.fullName || '';
            document.getElementById('phone').value = user.phone || '';
            document.getElementById('email').value = user.email || '';
            document.getElementById('gender').value = user.gender || '';
            document.getElementById('dob').value = user.dob ? user.dob.split('T')[0] : '';
            document.getElementById('role').value = user.role || 'USER';
        }

        document.getElementById('profile-form').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const profileData = {
                fullname: document.getElementById('fullName').value,
                phone: document.getElementById('phone').value,
                gender: document.getElementById('gender').value || null,
                dob: document.getElementById('dob').value || null
            };
            
            const submitBtn = e.target.querySelector('button[type="submit"]');
            const originalText = submitBtn.innerHTML;
            submitBtn.disabled = true;
            submitBtn.innerHTML = '<span class="spinner-border spinner-border-sm"></span> Đang lưu...';
            
            try {
                const updated = await apiClient.updateProfile(profileData);
                apiClient.setUser(updated);
                showAlert('Cập nhật thông tin thành công!', 'success');
            } catch (error) {
                showAlert('Cập nhật thất bại: ' + error.message, 'error');
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerHTML = originalText;
            }
        });

        document.getElementById('change-password-form').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const oldPassword = document.getElementById('oldPassword').value;
            const newPassword = document.getElementById('newPassword').value;
            const confirmPassword = document.getElementById('confirmNewPassword').value;
            
            if (newPassword !== confirmPassword) {
                showAlert('Mật khẩu xác nhận không khớp', 'error');
                return;
            }
            
            if (newPassword.length < 6) {
                showAlert('Mật khẩu phải có ít nhất 6 ký tự', 'error');
                return;
            }
            
            const submitBtn = e.target.querySelector('button[type="submit"]');
            const originalText = submitBtn.innerHTML;
            submitBtn.disabled = true;
            submitBtn.innerHTML = '<span class="spinner-border spinner-border-sm"></span> Đang đổi...';
            
            try {
                await apiClient.changePassword(oldPassword, newPassword);
                showAlert('Đổi mật khẩu thành công!', 'success');
                e.target.reset();
            } catch (error) {
                showAlert('Đổi mật khẩu thất bại: ' + error.message, 'error');
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerHTML = originalText;
            }
        });

        // Address management functions
        async function loadAddresses() {
            try {
                const response = await apiClient.request('/addresses', { method: 'GET' });
                console.log('response address: ', response);
                userAddresses = Array.isArray(response) ? response : [];
                renderAddresses(userAddresses);
            } catch (error) {
                console.error('Error loading addresses:', error);
                showAlert('Không thể tải danh sách địa chỉ: ' + error.message, 'error');
                userAddresses = [];
            }
        }

        function renderAddresses(addresses) {
            const container = document.getElementById('addresses-list');
            if (!container) return;
            
            if (!addresses || addresses.length === 0) {
                container.innerHTML = `
                    <div class="text-center py-5">
                        <i class="bi bi-inbox" style="font-size: 3rem; color: #ccc;"></i>
                        <p class="text-muted mt-3">Bạn chưa có địa chỉ nào</p>
                        <button class="btn btn-primary" onclick="showAddressModal()">
                            <i class="bi bi-plus-circle"></i> Thêm địa chỉ đầu tiên
                        </button>
                    </div>
                `;
                return;
            }
            
            container.innerHTML = addresses.map(addr => `
                <div class="card mb-3 address-item ${addr.isDefault ? 'border-warning border-2 bg-warning bg-opacity-10' : ''}">
                    <div class="card-body">
                        <div class="d-flex justify-content-between align-items-start">
                            <div class="flex-grow-1">
                                <div class="d-flex align-items-center mb-2">
                                    ${addr.isDefault ? '<i class="bi bi-star-fill text-warning me-2 fs-5" title="Địa chỉ mặc định"></i>' : ''}
                                    <strong>${addr.receiverName}</strong>
                                    ${addr.label ? `<span class="badge bg-secondary ms-2">${addr.label}</span>` : ''}
                                    ${addr.isDefault ? '<span class="badge bg-warning text-dark ms-2"><i class="bi bi-star-fill"></i> Mặc định</span>' : ''}
                                </div>
                                <p class="mb-1 text-muted">${addr.receiverPhone}</p>
                                <p class="mb-0">${addr.addressDetail}, ${addr.ward}, ${addr.province}</p>
                                ${addr.latitude && addr.longitude ? `
                                    <small class="text-muted">
                                        <i class="bi bi-geo-alt"></i> 
                                        <a href="https://maps.google.com/?q=${addr.latitude},${addr.longitude}" 
                                           target="_blank">Xem trên bản đồ</a>
                                    </small>
                                ` : ''}
                            </div>
                            <div class="ms-3">
                                <button class="btn btn-sm btn-outline-primary" onclick="showAddressModal(${addr.id})">
                                    <i class="bi bi-pencil"></i> Sửa
                                </button>
                                ${!addr.isDefault ? `
                                    <button class="btn btn-sm btn-outline-secondary" onclick="setDefaultAddress(${addr.id})">
                                        Đặt mặc định
                                    </button>
                                ` : ''}
                                <button class="btn btn-sm btn-outline-danger" onclick="deleteAddress(${addr.id})">
                                    <i class="bi bi-trash"></i> Xóa
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        async function setDefaultAddress(addressId) {
            try {
                await apiClient.request(`/addresses/${addressId}/set-default`, { method: 'PUT' });
                await loadAddresses();
                showAlert('Đã đặt làm địa chỉ mặc định', 'success');
            } catch (error) {
                showAlert('Lỗi: ' + error.message, 'error');
            }
        }

        async function deleteAddress(addressId) {
            if (!confirm('Bạn có chắc muốn xóa địa chỉ này?')) return;
            
            try {
                await apiClient.request(`/addresses/${addressId}`, { method: 'DELETE' });
                await loadAddresses();
                showAlert('Đã xóa địa chỉ', 'success');
            } catch (error) {
                showAlert('Lỗi: ' + error.message, 'error');
            }
        }

        // Load addresses when addresses tab is shown
        document.getElementById('addresses-tab')?.addEventListener('shown.bs.tab', function() {
            loadAddresses();
        });

        // Load addresses if hash is #addresses
        if (window.location.hash === '#addresses') {
            document.getElementById('addresses-tab')?.click();
        }
    </script>
</body>
</html>
