<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tài khoản - E-Commerce</title>
    
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <!-- Custom CSS -->
    <link href="/css/style.css" rel="stylesheet">
</head>
<body>
    <!-- Header -->
    <div id="header-container"></div>

    <!-- Main Content -->
    <main class="container my-5">
        <div class="row">
            <!-- Sidebar -->
            <div class="col-md-3">
                <div class="card">
                    <div class="card-body">
                        <ul class="nav nav-pills flex-column">
                            <li class="nav-item">
                                <a class="nav-link active" data-bs-toggle="pill" href="#profile-info">
                                    <i class="bi bi-person"></i> Thông tin cá nhân
                                </a>
                            </li>
                            <li class="nav-item">
                                <a class="nav-link" data-bs-toggle="pill" href="#change-password">
                                    <i class="bi bi-lock"></i> Đổi mật khẩu
                                </a>
                            </li>
                        </ul>
                    </div>
                </div>
            </div>

            <!-- Main Content -->
            <div class="col-md-9">
                <!-- Loading -->
                <div id="loading-spinner" class="loading-spinner active">
                    <div class="spinner-border text-primary" role="status">
                        <span class="visually-hidden">Loading...</span>
                    </div>
                </div>

                <!-- Content -->
                <div id="content" class="d-none">
                    <div class="tab-content">
                        <!-- Profile Info Tab -->
                        <div class="tab-pane fade show active" id="profile-info">
                            <div class="card">
                                <div class="card-header">
                                    <h5 class="mb-0">Thông tin cá nhân</h5>
                                </div>
                                <div class="card-body">
                                    <form id="profile-form">
                                        <div class="row">
                                            <div class="col-md-6 mb-3">
                                                <label for="fullName" class="form-label">Họ và tên</label>
                                                <input type="text" class="form-control" id="fullName">
                                            </div>
                                            
                                            <div class="col-md-6 mb-3">
                                                <label for="phone" class="form-label">Số điện thoại</label>
                                                <input type="tel" class="form-control" id="phone">
                                            </div>
                                        </div>
                                        
                                        <div class="row">
                                            <div class="col-md-6 mb-3">
                                                <label for="email" class="form-label">Email</label>
                                                <input type="email" class="form-control" id="email" disabled>
                                                <div class="form-text">Email không thể thay đổi</div>
                                            </div>
                                            
                                            <div class="col-md-6 mb-3">
                                                <label for="gender" class="form-label">Giới tính</label>
                                                <select class="form-select" id="gender">
                                                    <option value="">Chọn giới tính</option>
                                                    <option value="MALE">Nam</option>
                                                    <option value="FEMALE">Nữ</option>
                                                    <option value="OTHER">Khác</option>
                                                </select>
                                            </div>
                                        </div>
                                        
                                        <div class="mb-3">
                                            <label for="dob" class="form-label">Ngày sinh</label>
                                            <input type="date" class="form-control" id="dob">
                                        </div>
                                        
                                        <div class="mb-3">
                                            <label class="form-label">Vai trò</label>
                                            <input type="text" class="form-control" id="role" disabled>
                                        </div>
                                        
                                        <button type="submit" class="btn btn-primary-custom">
                                            <i class="bi bi-save"></i> Lưu thay đổi
                                        </button>
                                    </form>
                                </div>
                            </div>
                        </div>

                        <!-- Change Password Tab -->
                        <div class="tab-pane fade" id="change-password">
                            <div class="card">
                                <div class="card-header">
                                    <h5 class="mb-0">Đổi mật khẩu</h5>
                                </div>
                                <div class="card-body">
                                    <form id="change-password-form">
                                        <div class="mb-3">
                                            <label for="oldPassword" class="form-label">Mật khẩu cũ</label>
                                            <input type="password" class="form-control" id="oldPassword" required>
                                        </div>
                                        
                                        <div class="mb-3">
                                            <label for="newPassword" class="form-label">Mật khẩu mới</label>
                                            <input type="password" class="form-control" id="newPassword" required minlength="6">
                                            <div class="form-text">Mật khẩu tối thiểu 6 ký tự</div>
                                        </div>
                                        
                                        <div class="mb-3">
                                            <label for="confirmNewPassword" class="form-label">Xác nhận mật khẩu mới</label>
                                            <input type="password" class="form-control" id="confirmNewPassword" required>
                                        </div>
                                        
                                        <button type="submit" class="btn btn-primary-custom">
                                            <i class="bi bi-key"></i> Đổi mật khẩu
                                        </button>
                                    </form>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <div id="footer-container"></div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Common JS -->
    <script src="/js/common.js"></script>
    <!-- API Client -->
    <script src="/js/api.js"></script>
    <!-- Page Script -->
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            if (!apiClient.isAuthenticated()) {
                window.location.href = '/login.html?redirect=' + encodeURIComponent(window.location.pathname);
                return;
            }
            
            loadProfile();
        });

        async function loadProfile() {
            document.getElementById('loading-spinner').classList.add('active');
            document.getElementById('content').classList.add('d-none');

            try {
                const user = await apiClient.getProfile();
                populateProfileForm(user);
                apiClient.setUser(user);
            } catch (error) {
                showAlert('Không thể tải thông tin: ' + error.message, 'error');
                if (error.message.includes('401')) {
                    setTimeout(() => window.location.href = '/login.html', 2000);
                }
            } finally {
                document.getElementById('loading-spinner').classList.remove('active');
                document.getElementById('content').classList.remove('d-none');
            }
        }

        function populateProfileForm(user) {
            document.getElementById('fullName').value = user.fullName || '';
            document.getElementById('phone').value = user.phone || '';
            document.getElementById('email').value = user.email || '';
            document.getElementById('gender').value = user.gender || '';
            document.getElementById('dob').value = user.dob ? user.dob.split('T')[0] : '';
            document.getElementById('role').value = user.role || 'USER';
        }

        document.getElementById('profile-form').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const profileData = {
                fullname: document.getElementById('fullName').value,
                phone: document.getElementById('phone').value,
                gender: document.getElementById('gender').value || null,
                dob: document.getElementById('dob').value || null
            };
            
            const submitBtn = e.target.querySelector('button[type="submit"]');
            const originalText = submitBtn.innerHTML;
            submitBtn.disabled = true;
            submitBtn.innerHTML = '<span class="spinner-border spinner-border-sm"></span> Đang lưu...';
            
            try {
                const updated = await apiClient.updateProfile(profileData);
                apiClient.setUser(updated);
                showAlert('Cập nhật thông tin thành công!', 'success');
            } catch (error) {
                showAlert('Cập nhật thất bại: ' + error.message, 'error');
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerHTML = originalText;
            }
        });

        document.getElementById('change-password-form').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const oldPassword = document.getElementById('oldPassword').value;
            const newPassword = document.getElementById('newPassword').value;
            const confirmPassword = document.getElementById('confirmNewPassword').value;
            
            if (newPassword !== confirmPassword) {
                showAlert('Mật khẩu xác nhận không khớp', 'error');
                return;
            }
            
            if (newPassword.length < 6) {
                showAlert('Mật khẩu phải có ít nhất 6 ký tự', 'error');
                return;
            }
            
            const submitBtn = e.target.querySelector('button[type="submit"]');
            const originalText = submitBtn.innerHTML;
            submitBtn.disabled = true;
            submitBtn.innerHTML = '<span class="spinner-border spinner-border-sm"></span> Đang đổi...';
            
            try {
                await apiClient.changePassword(oldPassword, newPassword);
                showAlert('Đổi mật khẩu thành công!', 'success');
                e.target.reset();
            } catch (error) {
                showAlert('Đổi mật khẩu thất bại: ' + error.message, 'error');
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerHTML = originalText;
            }
        });
    </script>
</body>
</html>
