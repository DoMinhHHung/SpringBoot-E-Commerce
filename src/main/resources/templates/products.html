<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sản phẩm - E-Commerce</title>
    
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <!-- Custom CSS -->
    <link href="/css/style.css" rel="stylesheet">
    <link rel="icon" href="/logo/logo_web.png">
</head>
<body>
    <!-- Header -->
    <div id="header-container"></div>

    <!-- Main Content -->
    <main class="container-fluid my-4">
        <div class="row">
            <!-- Filter Sidebar -->
            <aside class="col-lg-3 col-md-4 filter-sidebar">
                <div class="filter-card">
                    <h5 class="filter-title">Bộ lọc</h5>
                    
                    <!-- Brand Filter -->
                    <div class="filter-section">
                        <h6 class="filter-section-title">Thương hiệu</h6>
                        <div id="brand-filter" class="filter-options">
                            <!-- Brands will be loaded dynamically -->
                            <div class="text-center py-3">
                                <div class="spinner-border spinner-border-sm text-primary" role="status">
                                    <span class="visually-hidden">Loading...</span>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Price Range Filter -->
                    <div class="filter-section">
                        <h6 class="filter-section-title">Phân khúc giá</h6>
                        <div class="filter-options">
                            <label class="filter-option">
                                <input type="radio" name="priceRange" value="all" checked onchange="applyFilters()">
                                <span>Tất cả</span>
                            </label>
                            <label class="filter-option">
                                <input type="radio" name="priceRange" value="0-10000000" onchange="applyFilters()">
                                <span>Dưới 10 triệu</span>
                            </label>
                            <label class="filter-option">
                                <input type="radio" name="priceRange" value="10000000-15000000" onchange="applyFilters()">
                                <span>Từ 10 - 15 triệu</span>
                            </label>
                            <label class="filter-option">
                                <input type="radio" name="priceRange" value="15000000-20000000" onchange="applyFilters()">
                                <span>Từ 15 - 20 triệu</span>
                            </label>
                            <label class="filter-option">
                                <input type="radio" name="priceRange" value="20000000-25000000" onchange="applyFilters()">
                                <span>Từ 20 - 25 triệu</span>
                            </label>
                            <label class="filter-option">
                                <input type="radio" name="priceRange" value="25000000-30000000" onchange="applyFilters()">
                                <span>Từ 25 - 30 triệu</span>
                            </label>
                            <label class="filter-option">
                                <input type="radio" name="priceRange" value="30000000-999999999" onchange="applyFilters()">
                                <span>Trên 30 triệu</span>
                            </label>
                        </div>
                    </div>

                    <!-- Sort Filter -->
                    <div class="filter-section">
                        <h6 class="filter-section-title">Sắp xếp</h6>
                        <div class="filter-options">
                            <label class="filter-option">
                                <input type="radio" name="sort" value="default" checked onchange="applyFilters()">
                                <span>Mặc định</span>
                            </label>
                            <label class="filter-option">
                                <input type="radio" name="sort" value="price-asc" onchange="applyFilters()">
                                <span>Giá: Thấp → Cao</span>
                            </label>
                            <label class="filter-option">
                                <input type="radio" name="sort" value="price-desc" onchange="applyFilters()">
                                <span>Giá: Cao → Thấp</span>
                            </label>
                            <label class="filter-option">
                                <input type="radio" name="sort" value="name-asc" onchange="applyFilters()">
                                <span>Tên: A → Z</span>
                            </label>
                            <label class="filter-option">
                                <input type="radio" name="sort" value="name-desc" onchange="applyFilters()">
                                <span>Tên: Z → A</span>
                            </label>
                        </div>
                    </div>
                </div>
            </aside>

            <!-- Product Grid -->
            <div class="col-lg-9 col-md-8">
                <!-- Page Header -->
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <h2 id="page-title" class="fw-bold">Sản phẩm</h2>
                    <div class="d-flex align-items-center gap-2">
                        <span class="text-muted" id="product-count">0 sản phẩm</span>
                    </div>
                </div>

                <!-- Loading Spinner -->
                <div id="products-loading" class="text-center py-5">
                    <div class="spinner-border text-primary" role="status">
                        <span class="visually-hidden">Loading...</span>
                    </div>
                </div>

                <!-- Products Grid -->
                <div id="products-grid" class="products-grid">
                    <!-- Products will be loaded here -->
                </div>

                <!-- Empty State -->
                <div id="empty-state" class="text-center py-5 d-none">
                    <i class="bi bi-inbox" style="font-size: 4rem; color: #ccc;"></i>
                    <p class="mt-3 text-muted">Không tìm thấy sản phẩm nào</p>
                </div>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <div id="footer-container"></div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Common JS -->
    <script src="/js/common.js"></script>
    <!-- API Client -->
    <script src="/js/api.js"></script>
    <!-- Products Page Script -->
    <script src="/js/products.js"></script>
</body>
</html>
