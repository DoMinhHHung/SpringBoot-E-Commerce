<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đơn hàng của tôi - E-Commerce</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <link href="/css/style.css" rel="stylesheet">
</head>
<body>
    <div id="header-container"></div>

    <main class="container my-5">
        <h2 class="mb-4"><i class="bi bi-box-seam"></i> Đơn hàng của tôi</h2>

        <!-- Search Bar -->
        <div class="orders-search-section mb-4">
            <div class="input-group input-group-lg">
                <span class="input-group-text bg-white border-end-0">
                    <i class="bi bi-search text-muted"></i>
                </span>
                <input type="text" class="form-control border-start-0 ps-0" 
                       id="order-search-input" 
                       placeholder="Bạn có thể tìm kiếm theo ID đơn hàng hoặc Tên Sản phẩm">
                <button class="btn btn-danger px-4" id="btn-search-order">
                    Tìm đơn hàng
                </button>
            </div>
        </div>

        <!-- Status Tabs -->
        <div class="orders-tabs-section mb-4">
            <div class="orders-tabs-wrapper">
                <button class="order-tab active" data-status="">
                    Tất cả
                </button>
                <button class="order-tab" data-status="PENDING">
                    Chờ xác nhận
                </button>
                <button class="order-tab" data-status="PROCESSING">
                    Vận chuyển
                </button>
                <button class="order-tab" data-status="SHIPPED">
                    Chờ giao hàng
                </button>
                <button class="order-tab" data-status="DELIVERED">
                    Hoàn thành
                </button>
                <button class="order-tab" data-status="CANCELLED">
                    Đã hủy
                </button>
                <button class="order-tab" data-status="REFUNDED">
                    Trả hàng/Hoàn tiền
                </button>
            </div>
        </div>

        <!-- Orders List -->
        <div id="orders-list">
            <div class="text-center py-5">
                <div class="spinner-border text-danger" role="status">
                    <span class="visually-hidden">Loading...</span>
                </div>
                <p class="mt-3 text-muted">Đang tải danh sách đơn hàng...</p>
            </div>
        </div>

        <!-- Pagination -->
        <nav aria-label="Page navigation" class="mt-4">
            <ul class="pagination justify-content-center" id="pagination">
                <!-- Pagination will be generated by JS -->
            </ul>
        </nav>
    </main>

    <div id="footer-container"></div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/api.js"></script>
    <script src="/js/common.js"></script>
    <script src="/js/orders.js"></script>
</body>
</html>
