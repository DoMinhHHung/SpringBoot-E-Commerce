<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thông báo - E-Commerce</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <!-- Custom CSS -->
    <link href="/css/style.css" rel="stylesheet">
</head>
<body class="bg-light">
    <!-- Header -->
    <div id="header-container"></div>

    <!-- Main Content -->
    <main class="container my-5">
        <div class="row justify-content-center">
            <div class="col-lg-9">
                <div class="d-flex flex-column flex-md-row align-items-md-center justify-content-between mb-4">
                    <div>
                        <h2 class="mb-1">Trung tâm thông báo</h2>
                        <p class="text-muted mb-0">Xem lại toàn bộ thông báo đã được gửi tới bạn.</p>
                    </div>
                    <div class="mt-3 mt-md-0">
                        <button id="reload-notifications" class="btn btn-outline-primary me-2">
                            <i class="bi bi-arrow-clockwise"></i> Làm mới
                        </button>
                        <button id="mark-all-notifications" class="btn btn-outline-secondary">
                            <i class="bi bi-check2-circle"></i> Đánh dấu tất cả đã đọc
                        </button>
                    </div>
                </div>

                <div class="card shadow-sm">
                    <div class="card-body">
                        <div id="notifications-loading" class="text-center py-4">
                            <div class="spinner-border text-primary" role="status">
                                <span class="visually-hidden">Đang tải...</span>
                            </div>
                            <p class="mt-3 text-muted mb-0">Đang tải thông báo...</p>
                        </div>

                        <div id="notifications-error" class="alert alert-danger d-none" role="alert"></div>

                        <div id="notifications-empty" class="text-center py-5 d-none">
                            <img src="/images/empty-state.svg" alt="Empty" style="width:160px;max-width:60%;">
                            <h5 class="mt-4">Không có thông báo</h5>
                            <p class="text-muted mb-4">Bạn sẽ thấy thông báo mới khi có khuyến mãi, sản phẩm hoặc cập nhật quan trọng.</p>
                            <button id="empty-refresh" class="btn btn-primary">
                                <i class="bi bi-arrow-clockwise"></i> Thử lại
                            </button>
                        </div>

                        <ul id="notifications-list" class="list-group list-group-flush d-none"></ul>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <div id="footer-container"></div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/api.js"></script>
    <script src="/js/common.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function () {
            const listEl = document.getElementById('notifications-list');
            const loadingEl = document.getElementById('notifications-loading');
            const errorEl = document.getElementById('notifications-error');
            const emptyEl = document.getElementById('notifications-empty');
            const reloadBtn = document.getElementById('reload-notifications');
            const emptyRefreshBtn = document.getElementById('empty-refresh');
            const markAllBtn = document.getElementById('mark-all-notifications');

            async function fetchNotifications() {
                showState('loading');
                try {
                    const headers = {};
                    try {
                        const token = apiClient && typeof apiClient.getAuthToken === 'function'
                            ? apiClient.getAuthToken()
                            : null;
                        if (token) headers['Authorization'] = 'Bearer ' + token;
                    } catch (e) {}

                    const response = await fetch('/api/notifications', {
                        credentials: 'same-origin',
                        headers
                    });

                    const contentType = (response.headers.get('content-type') || '').toLowerCase();
                    if (!response.ok || !contentType.includes('application/json')) {
                        const body = await response.text();
                        const isLogin = body && body.toLowerCase().includes('đăng nhập');
                        throw new Error(isLogin ? 'Vui lòng đăng nhập để xem thông báo.' : 'Không thể tải danh sách thông báo.');
                    }

                    const data = await response.json();
                    renderNotifications(Array.isArray(data) ? data : []);
                } catch (err) {
                    showState('error', err.message || 'Đã xảy ra lỗi, vui lòng thử lại.');
                }
            }

            function renderNotifications(items) {
                if (!items || items.length === 0) {
                    showState('empty');
                    return;
                }

                items.sort((a, b) => {
                    const tsA = a.timestamp || 0;
                    const tsB = b.timestamp || 0;
                    return tsB - tsA;
                });

                const fragment = document.createDocumentFragment();
                items.forEach(item => fragment.appendChild(buildNotificationItem(item)));

                listEl.innerHTML = '';
                listEl.appendChild(fragment);
                showState('list');
            }

            function buildNotificationItem(item) {
                const li = document.createElement('li');
                li.className = 'list-group-item d-flex justify-content-between align-items-start';
                li.dataset.id = item.id || '';
                if (item.read) {
                    li.classList.add('list-group-item-secondary');
                }

                const timestamp = formatTime(item.timestamp);
                li.innerHTML = `
                    <div class="ms-2 me-auto">
                        <div class="fw-bold">${escapeHtml(item.title || 'Thông báo')}</div>
                        <div class="text-muted small mb-2">${escapeHtml(item.message || '')}</div>
                        <div class="d-flex gap-2 flex-wrap">
                            ${item.url ? `<a href="${escapeAttribute(item.url)}" class="btn btn-sm btn-outline-primary">
                                <i class="bi bi-box-arrow-up-right"></i> Xem chi tiết
                            </a>` : ''}
                            <button class="btn btn-sm btn-outline-secondary mark-read-btn">
                                <i class="bi bi-check2-circle"></i> Đánh dấu đã đọc
                            </button>
                        </div>
                    </div>
                    <div class="text-muted small text-nowrap ms-2">${escapeHtml(timestamp)}</div>
                `;

                const markBtn = li.querySelector('.mark-read-btn');
                markBtn.addEventListener('click', async () => {
                    await markNotificationRead(item.id);
                    li.classList.add('list-group-item-secondary');
                });

                return li;
            }

            async function markNotificationRead(id) {
                if (!id) return;
                try {
                    await fetch('/api/notifications/' + encodeURIComponent(id) + '/read', {
                        method: 'PUT',
                        credentials: 'same-origin'
                    });
                } catch (e) {
                    console.warn('markNotificationRead failed', e);
                }
            }

            async function markAllNotifications() {
                try {
                    await fetch('/api/notifications/read-all', {
                        method: 'PUT',
                        credentials: 'same-origin'
                    });
                    document.querySelectorAll('#notifications-list .list-group-item').forEach(li => {
                        li.classList.add('list-group-item-secondary');
                    });
                    if (typeof markAllRead === 'function') {
                        markAllRead();
                    }
                } catch (e) {
                    console.warn('markAllNotifications failed', e);
                }
            }

            function showState(state, message) {
                loadingEl.classList.toggle('d-none', state !== 'loading');
                listEl.classList.toggle('d-none', state !== 'list');
                emptyEl.classList.toggle('d-none', state !== 'empty');
                errorEl.classList.toggle('d-none', state !== 'error');
                if (state === 'error') {
                    errorEl.textContent = message || 'Đã xảy ra lỗi.';
                }
            }

            function formatTime(ts) {
                if (!ts) return '';
                try {
                    const date = new Date(ts);
                    return date.toLocaleString('vi-VN');
                } catch (e) {
                    return ts;
                }
            }

            function escapeHtml(str) {
                return String(str || '').replace(/[&<>"']/g, (m) => ({
                    '&': '&amp;',
                    '<': '&lt;',
                    '>': '&gt;',
                    '"': '&quot;',
                    "'": '&#39;'
                }[m]));
            }

            function escapeAttribute(str) {
                return escapeHtml(str).replace(/"/g, '&quot;');
            }

            reloadBtn.addEventListener('click', fetchNotifications);
            emptyRefreshBtn.addEventListener('click', fetchNotifications);
            markAllBtn.addEventListener('click', async () => {
                await markAllNotifications();
            });

            fetchNotifications();
        });
    </script>
</body>
</html>
