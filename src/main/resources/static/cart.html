<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E-Commerce - PC Gaming, Laptop chính hãng</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <!-- Custom CSS -->
    <link href="/css/style.css" rel="stylesheet">
</head>
<body>
<!-- Header -->
<div id="header-container"></div>

<!-- Main Content -->
<main class="container my-5">

    <!-- Products Section -->
    <section class="products-section">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2 class="fw-bold">Sản phẩm nổi bật</h2>
            <div class="btn-group" role="group">
                <button type="button" class="btn btn-outline-secondary active" onclick="filterProducts('ALL')">Tất cả
                </button>
                <button type="button" class="btn btn-outline-secondary" onclick="filterProducts('PC')">PC</button>
                <button type="button" class="btn btn-outline-secondary" onclick="filterProducts('LAPTOP')">Laptop
                </button>
                <button type="button" class="btn btn-outline-secondary" onclick="filterProducts('KEYBOARD')">Bàn phím
                </button>
                <button type="button" class="btn btn-outline-secondary" onclick="filterProducts('MOUSE')">Chuột</button>
            </div>
        </div>
        <main class="container my-5">
            <h2 class="mb-4">Giỏ hàng của bạn</h2>
            <div id="cart-container" class="table-responsive">
                <table class="table table-bordered align-middle">
                    <thead>
                    <tr>
                        <th>Sản phẩm</th>
                        <th>Đơn giá</th>
                        <th>Số lượng</th>
                        <th>Tổng</th>
                        <th>Hành động</th>
                    </tr>
                    </thead>
                    <tbody id="cart-items">
                    <!-- Items sẽ được load từ JS -->
                    </tbody>
                    <tfoot>
                    <tr>
                        <th colspan="2">Tổng số lượng:</th>
                        <td id="total-quantity">0</td>
                        <th id="total-price">0₫</th>
                        <td></td>
                    </tr>
                    </tfoot>
                </table>
            </div>
        </main>

        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

        <!-- Project JS dependencies -->
        <script src="/js/api.js"></script>
        <script src="/js/common.js"></script>
        <script src="/js/cart.js"></script>
    </section>
</main>

</body>
</html>
